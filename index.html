<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Food Discovery｜食物探索 — 認識食材，探索料理，建立自己的飲食文化</title>

    <!-- Lucide Icons -->

    <!-- Google Fonts: Noto Sans TC & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Inter"', 'sans-serif'],
                    },
                    colors: {
                        cream: {
                            50: '#FAF7F2',
                            100: '#F3EDE3',
                            200: '#E8E2D7',
                        },
                        sage: {
                            50: '#F1F5F1',
                            100: '#E1EAE2',
                            200: '#C4D6C6',
                            500: '#5F7A61',
                            600: '#4A634C',
                            700: '#3A4F3C',
                        },
                        terracotta: {
                            50: '#FDF4EF',
                            100: '#FAE4D7',
                            400: '#E38D62',
                            500: '#D97A4A',
                            600: '#C26536',
                        },
                        cocoa: {
                            700: '#6A6156',
                            800: '#474038',
                            900: '#2F2A24',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            background-color: #FAF7F2;
            color: #2F2A24;
            -webkit-tap-highlight-color: transparent;
        }
        body.modal-open {
            overflow: hidden;
        }
        button, a, label, input, select, textarea {
            touch-action: manipulation;
        }
        .card-shadow {
            box-shadow: 0 4px 20px -2px rgba(47, 42, 36, 0.05);
        }
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        /* 只在有滑鼠的裝置使用浮起效果，避免手機點擊後卡在 hover 狀態 */
        @media (hover: hover) and (pointer: fine) {
            .card-hover:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 26px -4px rgba(47, 42, 36, 0.09);
            }
        }
        .card-hover:active {
            transform: scale(0.99);
        }
        /* iOS Safari 對小於 16px 的輸入框會自動放大畫面，手機版統一 16px */
        @media (max-width: 639px) {
            input[type="text"], input[type="search"], input[type="date"], select, textarea {
                font-size: 16px !important;
            }
        }
        input[type="search"]::-webkit-search-cancel-button {
            -webkit-appearance: none;
        }
        .safe-bottom {
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }
        .safe-bottom-offset {
            bottom: max(1rem, env(safe-area-inset-bottom));
        }
        .modal-sheet {
            max-height: 92vh;
            max-height: 92dvh;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 640px) {
            .modal-sheet {
                max-height: none;
                overflow: hidden;
            }
        }
        /* 手機版底部彈出面板上方的拖曳提示條 */
        .sheet-handle {
            width: 40px;
            height: 4px;
            border-radius: 9999px;
            background: rgba(47, 42, 36, 0.18);
            margin: 10px auto 0;
        }
        @media (min-width: 640px) {
            .sheet-handle { display: none; }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-sage-200 selection:text-cocoa-900">

            <button onclick="navigateTo('home')" class="flex items-center gap-2.5 text-left group focus:outline-none cursor-pointer min-w-0">

            <!-- Desktop Navigation -->
            <nav class="hidden md:flex items-center gap-1.5 bg-cream-100 p-1 rounded-2xl border border-cream-200">

            <button data-nav="explore" onclick="navigateTo('explore')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-base font-medium">食物探索</button>

            <button data-nav="ingredients" onclick="navigateTo('ingredients')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-base font-medium">食材圖鑑</button>
            <button data-nav="diary" onclick="navigateTo('diary')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-base font-medium">我的飲食日記</button>
        </div>
    </header>

    <!-- Toast Notification Banner -->
    <div id="toast-container" class="fixed top-20 inset-x-4 items-center sm:items-end sm:inset-x-auto sm:top-auto sm:bottom-5 sm:right-5 z-[60] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Main Content Container -->
    <main id="app-content" class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-10">
        <!-- Views are rendered dynamically here -->
    </main>

    <!-- Dish Detail Modal -->
    <div id="dish-modal" role="dialog" aria-modal="true" aria-label="料理詳情" class="fixed inset-0 z-50 hidden overflow-y-auto overscroll-contain bg-cocoa-900/50 backdrop-blur-sm p-0 sm:p-6 flex items-end sm:items-center justify-center">
        <div id="dish-modal-content" class="modal-sheet bg-cream-50 w-full max-w-3xl rounded-t-3xl sm:rounded-3xl shadow-2xl border border-cream-200 sm:my-auto">

        </div>

    <div id="share-card-modal" role="dialog" aria-modal="true" aria-label="飲食故事分享卡" class="fixed inset-0 z-50 hidden overflow-y-auto overscroll-contain bg-cocoa-900/60 backdrop-blur-sm p-0 sm:p-6 flex items-end sm:items-center justify-center">
        <div id="share-card-modal-content" class="modal-sheet bg-cream-50 w-full max-w-xl rounded-t-3xl sm:rounded-3xl shadow-2xl border border-cream-200 sm:my-auto">

        </div>

    <!-- Footer -->
    <footer class="bg-cream-100 border-t border-cream-200 mt-16 pt-8 safe-bottom" style="padding-bottom: max(2rem, env(safe-area-inset-bottom));">

            <div class="font-bold text-cocoa-900">Food Discovery｜食物探索</div>
            <div class="text-xs text-cocoa-700">認識食材，探索料理，建立自己的飲食文化。</div>
        </div>
    </footer>

    <script>
        // =========================================================================
        // 1. UTILITY HELPERS
        // =========================================================================
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-terracotta-600 text-white' : 'bg-cocoa-900 text-cream-50';
            toast.className = `${bgColor} px-4 py-3 rounded-2xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transition-all`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(6px)';
                setTimeout(() => toast.remove(), 220);
            }, 2600);
        }

        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDateDaysAgoStr(daysAgo) {
            const dt = new Date();
            dt.setDate(dt.getDate() - daysAgo);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // =========================================================================
        // 2. DISH IMAGE MAPPING (GitHub Raw Assets, remapped by photo content + Consistent Placeholder)
        // =========================================================================
        // 注意：GitHub 上的圖檔是依「舊版料理清單」編號，與目前 DISHES 的 dish_id 不同，
        // 以下依照片實際內容對應（例如番茄炒蛋 D02 的照片檔名是 D04.jpg）。
        // 沒有對應照片的料理會自動使用 renderConsistentPlaceholder() 占位卡。
        const DISH_IMAGE_BASE = "https://raw.githubusercontent.com/nickwang1030-design/-food-discovery/main/";
        const DISH_IMAGE_URLS = {
            D01: DISH_IMAGE_BASE + "D01.jpg", // 日式親子丼
            D02: DISH_IMAGE_BASE + "D04.jpg", // 番茄炒蛋
            D03: DISH_IMAGE_BASE + "D06.jpg", // 馬鈴薯燉肉
            D05: DISH_IMAGE_BASE + "D02.jpg", // 香菇雞湯
            D06: DISH_IMAGE_BASE + "D05.jpg", // 麻婆豆腐
            D08: DISH_IMAGE_BASE + "D10.jpg"  // 越式雞肉河粉（原圖僅 300×225，建議日後換高解析版）
            // 尚無對應照片：D04 高麗菜炒豬肉、D07 韓式豆腐鍋、D09 泰式綠咖哩雞、D10 印尼炒飯、D11～D25
            // 儲存庫中未使用的圖：D03.jpg 韓式雞肉拌飯、D07.jpg 高麗菜豬肉鍋、D08.jpg 番茄豆腐湯、D09.jpg 泰式打拋豬
        };

        function renderConsistentPlaceholder(dish, size = 'card') {
            const isCompact = size === 'thumb';
            const cuisineThemes = {
                '日本': 'from-rose-50 via-cream-100 to-sage-100 text-rose-700',
                '台灣': 'from-amber-50 via-cream-100 to-terracotta-100 text-amber-800',
                '中國': 'from-red-50 via-cream-100 to-amber-100 text-red-800',
                '韓國': 'from-orange-50 via-cream-100 to-rose-100 text-orange-800',
                '越南': 'from-emerald-50 via-cream-100 to-lime-100 text-emerald-800',
                '泰國': 'from-lime-50 via-cream-100 to-amber-100 text-lime-800',
                '印尼': 'from-amber-100 via-cream-100 to-orange-100 text-amber-900',
                '馬來西亞': 'from-yellow-50 via-cream-100 to-orange-100 text-amber-800',
                '菲律賓': 'from-sky-50 via-cream-100 to-amber-100 text-sky-800',
                '新加坡': 'from-rose-50 via-cream-100 to-amber-100 text-rose-800',
                '義大利': 'from-emerald-50 via-cream-100 to-terracotta-100 text-emerald-800',
                '法國': 'from-indigo-50 via-cream-100 to-rose-100 text-indigo-800',
                '西班牙': 'from-orange-100 via-amber-50 to-red-100 text-orange-900',
                '美國': 'from-amber-50 via-cream-100 to-sky-100 text-amber-900',
                '墨西哥': 'from-lime-100 via-amber-50 to-orange-100 text-lime-900',
                '英國': 'from-slate-100 via-cream-100 to-amber-100 text-slate-800'
            };
            const themeClass = cuisineThemes[dish.cuisine] || 'from-cream-100 via-sage-50 to-terracotta-50 text-sage-700';

            return `
                <div class="w-full h-full bg-gradient-to-br ${themeClass} flex flex-col items-center justify-center relative select-none p-3 text-center">
                    ${!isCompact ? `
                        <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-cocoa-900/80 text-cream-50 text-[11px] font-semibold">
                            ${escapeHTML(dish.cuisine)}
                        </span>
                    ` : ''}
                    <div class="${isCompact ? 'w-8 h-8' : 'w-11 h-11'} rounded-2xl bg-white/90 border border-white text-current flex items-center justify-center shadow-sm">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="${isCompact ? 'w-4 h-4' : 'w-5 h-5'}">
                            <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/>
                            <path d="M7 2v20"/>
                            <path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>
                        </svg>
                    </div>
                    ${!isCompact ? `
                        <span class="mt-2 text-xs font-bold text-cocoa-900 tracking-wide">${escapeHTML(dish.dish_name)}</span>
                        <span class="text-[10px] text-cocoa-700 mt-0.5">${escapeHTML(dish.cuisine)}風味 • ${escapeHTML(dish.cooking_method)}</span>
                    ` : ''}
                </div>
            `;
        }

        function renderDishIllustration(dish, size = 'card') {
            const imageUrl = DISH_IMAGE_URLS[dish.dish_id];
            const isCompact = size === 'thumb';

            if (imageUrl) {
                return `
                    <div class="relative w-full h-full bg-cream-100 overflow-hidden">
                        <img
                            src="${escapeHTML(imageUrl)}"
                            alt="${escapeHTML(dish.dish_name)}"
                            loading="lazy"
                            onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
                            class="w-full h-full object-cover"
                        />
                        <div class="hidden w-full h-full">
                            ${renderConsistentPlaceholder(dish, size)}
                        </div>
                        ${!isCompact ? `
                            <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full bg-cocoa-900/80 text-cream-50 text-[11px] font-semibold backdrop-blur-sm">
                                ${escapeHTML(dish.cuisine)}
                            </span>
                        ` : ''}
                    </div>
                `;
            }

            return renderConsistentPlaceholder(dish, size);
        }

        // =========================================================================
        // 3. COMPLETE DATASETS (25 Dishes, 30 Ingredients, 4 Contexts, Creators)
        // =========================================================================
        const DISHES = [
            { dish_id: "D01", dish_name: "日式親子丼", cuisine: "日本", ingredients: ["雞肉", "蛋", "洋蔥", "白飯"], extra_ingredients: ["醬油", "味醂", "清酒", "高湯", "蔥花"], cooking_method: "煮", cooking_time: 20, difficulty: "簡單", context: "一個人簡單吃", description: "滑嫩蛋液包裹鮮嫩雞肉與清甜洋蔥，鋪在熱騰騰白飯上的日本經典家常丼飯。", food_culture: "親子丼誕生於明治時代的東京，名稱源自同時使用雞肉與雞蛋（親子）的食材組合，展現日本家庭料理講究高湯鮮味與快速溫暖的餐桌文化。", recommendation_reason: "備料單純且 20 分鐘即可完成，一碗就能同時攝取蛋白質與主食" },
            { dish_id: "D02", dish_name: "番茄炒蛋", cuisine: "台灣", ingredients: ["番茄", "蛋"], extra_ingredients: ["蔥", "鹽", "糖", "食用油"], cooking_method: "快炒", cooking_time: 10, difficulty: "簡單", context: "家庭料理", description: "酸甜多汁的番茄搭配蓬鬆滑嫩的炒蛋，是台灣家庭餐桌上最親切的家常菜。", food_culture: "番茄炒蛋在 20 世紀初隨著西式食材普及融入華人家庭廚房，因色澤紅黃喜氣、酸甜下飯，成為跨越世代的經典家常記憶。", recommendation_reason: "只需兩樣核心食材、10 分鐘就能上桌，酸甜開胃又百搭" },
            { dish_id: "D03", dish_name: "馬鈴薯燉肉", cuisine: "日本", ingredients: ["豬肉", "馬鈴薯", "洋蔥", "紅蘿蔔"], extra_ingredients: ["醬油", "味醂", "糖", "高湯"], cooking_method: "燉煮", cooking_time: 35, difficulty: "簡單", context: "家庭料理", description: "綿密入味的馬鈴薯與紅蘿蔔吸收鹹甜醬汁，搭配軟嫩豬肉片的溫暖燉菜。", food_culture: "馬鈴薯燉肉（肉じゃが）據傳起源於 19 世紀末日本海軍嘗試重現西式燉牛肉時改用醬油與糖調味，演變為象徵「媽媽的味道」的代表性家庭料理。", recommendation_reason: "一鍋燉煮就能完成主菜與配菜，隔餐加熱風味更濃郁" },
            { dish_id: "D04", dish_name: "高麗菜炒豬肉", cuisine: "台灣", ingredients: ["高麗菜", "豬肉"], extra_ingredients: ["蒜頭", "醬油", "鹽", "白胡椒"], cooking_method: "快炒", cooking_time: 12, difficulty: "簡單", context: "一個人簡單吃", description: "大火快炒保留高麗菜的清甜爽脆，搭配香氣十足的豬肉片。", food_culture: "台灣高山與平地高麗菜品質優良，搭配蒜片與豬肉片快炒，體現台式熱炒講究火候與食材原味的日常飲食特色。", recommendation_reason: "快速爽脆、食材容易取得，搭配白飯就是滿足的一餐" },
            { dish_id: "D05", dish_name: "香菇雞湯", cuisine: "台灣", ingredients: ["雞肉", "菇類"], extra_ingredients: ["薑片", "米酒", "鹽", "枸杞"], cooking_method: "煮湯", cooking_time: 40, difficulty: "簡單", context: "家庭料理", description: "乾香菇與雞肉慢火熬煮出清澈甘甜的湯頭，溫潤暖胃。", food_culture: "台灣飲食文化重視季節溫補，香菇雞湯常出現在家庭聚餐與日常晚餐中，藉由乾貨香菇釋放的天然鮮味凝聚家人情感。", recommendation_reason: "步驟簡單卻富含深層鮮味，適合全家人一起享用" },

        function normalizeTagList(rawTags) {
            if (!Array.isArray(rawTags)) return [];
            const seen = new Set();
            const result = [];
            rawTags.forEach(item => {
                if (typeof item !== 'string') return;
                const cleaned = item.trim().replace(/^#+/, '').trim();
                if (!cleaned) return;
                if (!seen.has(cleaned)) {
                    seen.add(cleaned);
                    result.push(cleaned);
                }
            });
            return result;
        }

        function normalizeDiaryEntry(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const dishName = String(raw.dish_name || '').trim();
            if (!dishName) return null;

            const legacyNotes = String(raw.notes || '').trim();
            const story = raw.story !== undefined && raw.story !== null
                ? String(raw.story).trim()
                : legacyNotes;

            // 餐別獨立存放於 meal_type，不再混入標籤；並移除舊版自動合併進來的餐別標籤
            const mealTypeStr = raw.meal_type ? String(raw.meal_type).trim() : '';
            const mergedTags = normalizeTagList(Array.isArray(raw.tags) ? raw.tags : [])
                .filter(tag => !mealTypeStr || tag !== mealTypeStr);

            return {
                id: raw.id || `entry_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                date: raw.date || getTodayStr(),
                meal_type: raw.meal_type || '晚餐',
                dish_name: dishName,
                matched_dish_id: raw.matched_dish_id || null,
                ingredients: Array.isArray(raw.ingredients) ? raw.ingredients : [],
                story: story,
                notes: story,
                tags: mergedTags,
                photo: typeof raw.photo === 'string' && raw.photo ? raw.photo : null
            };
        }

        function loadDiaryEntries() {
            try {
                const rawV2 = localStorage.getItem(DIARY_STORAGE_KEY);
                let parsed = null;
                if (rawV2) {
                    parsed = JSON.parse(rawV2);
                } else {
                    const rawLegacy = localStorage.getItem('food_discovery_diary_records_v1') || localStorage.getItem('food_diary_entries');
                    if (rawLegacy) {
                        parsed = JSON.parse(rawLegacy);
                    }
                }
                if (Array.isArray(parsed)) {
                    state.diaryEntries = parsed.map(normalizeDiaryEntry).filter(Boolean);
                    return;
                }
            } catch (e) {
                console.warn('讀取飲食日記紀錄時發生問題：', e);
            }
            state.diaryEntries = [];
        }

        function saveDiaryEntries() {
            try {
                localStorage.setItem(DIARY_STORAGE_KEY, JSON.stringify(state.diaryEntries));
                return { ok: true, strippedPhoto: false };
            } catch (e) {
                const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
                if (isQuota) {
                    try {
                        const withoutPhotos = state.diaryEntries.map(item => ({
                            ...item,
                            photo: null
                        }));
                        localStorage.setItem(DIARY_STORAGE_KEY, JSON.stringify(withoutPhotos));
                        state.diaryEntries = withoutPhotos;
                        return { ok: true, strippedPhoto: true };
                    } catch (retryErr) {
                        console.warn('清除照片後儲存仍失敗：', retryErr);
                    }
                }
                console.warn('儲存飲食日記紀錄時發生問題：', e);

            }

        // =========================================================================
        // 6. RECOMMENDATION ENGINE & 7-DAY DIARY ANALYTICS
        // =========================================================================
        function scoreDish(dish, selectedIngredients, selectedContext) {
            let score = 0;
            const matchedIngredients = [];

            selectedIngredients.forEach(ingName => {
                if (dish.ingredients.includes(ingName)) {
                    score += 3;
                    matchedIngredients.push(ingName);
                } else if (dish.extra_ingredients && dish.extra_ingredients.includes(ingName)) {
                    score += 1;
                    matchedIngredients.push(`${ingName}（配料）`);
                }
            });

            const contextMatched = Boolean(selectedContext && dish.context === selectedContext);
            if (contextMatched) {
                score += 2;
            }

            return {
                dish,
                score,
                matchedIngredients,
                contextMatched
            };
        }

        function getRecommendedDishes({ selectedIngredients = [], selectedContext = '', noPreference = false, limit = 3 }) {
            if (noPreference) {
                const shuffled = [...DISHES].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, limit).map(dish => ({
                    dish,
                    score: 1,
                    matchedIngredients: [],
                    contextMatched: Boolean(selectedContext && dish.context === selectedContext),
                    isRandomDiscovery: true
                }));
            }

            const scored = DISHES.map(dish => scoreDish(dish, selectedIngredients, selectedContext));
            const filtered = scored.filter(item => {
                if (selectedIngredients.length > 0 && selectedContext) {
                    return item.matchedIngredients.length > 0 || item.contextMatched;
                }
                if (selectedIngredients.length > 0) {
                    return item.matchedIngredients.length > 0;
                }
                if (selectedContext) {
                    return item.contextMatched;
                }
                return true;
            });

            filtered.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                if (b.matchedIngredients.length !== a.matchedIngredients.length) {
                    return b.matchedIngredients.length - a.matchedIngredients.length;
                }
                return a.dish.cooking_time - b.dish.cooking_time;
            });

            if (filtered.length === 0) {
                return [...DISHES]
                    .sort((a, b) => a.cooking_time - b.cooking_time)
                    .slice(0, limit)
                    .map(dish => ({
                        dish,
                        score: 0,
                        matchedIngredients: [],
                        contextMatched: false,
                        isFallback: true
                    }));
            }

            return filtered.slice(0, limit);
        }

        function analyzeRecent7DaysDiary() {
            const cutoffStr = getDateDaysAgoStr(6);
            const recentEntries = state.diaryEntries.filter(entry => entry.date >= cutoffStr);

            const ingredientCounts = {};
            const loggedDishIds = new Set();
            const loggedDishNames = new Set();

            recentEntries.forEach(entry => {
                if (entry.matched_dish_id) loggedDishIds.add(entry.matched_dish_id);
                if (entry.dish_name) loggedDishNames.add(entry.dish_name.trim());

                let entryIngs = Array.isArray(entry.ingredients) ? [...entry.ingredients] : [];
                if (entryIngs.length === 0 && entry.matched_dish_id) {
                    const matched = DISHES.find(d => d.dish_id === entry.matched_dish_id);
                    if (matched) entryIngs = [...matched.ingredients];
                }
                if (entryIngs.length === 0 && entry.dish_name) {
                    const byName = DISHES.find(d => d.dish_name === entry.dish_name.trim());
                    if (byName) entryIngs = [...byName.ingredients];
                }
                if (entryIngs.length === 0 && Array.isArray(entry.tags)) {
                    const knownIngSet = new Set(INGREDIENTS.map(i => i.ingredient_name));
                    entryIngs = entry.tags.filter(t => knownIngSet.has(t));
                }

                entryIngs.forEach(ing => {
                    ingredientCounts[ing] = (ingredientCounts[ing] || 0) + 1;
                });
            });

            const sortedIngredients = Object.entries(ingredientCounts)
                .sort((a, b) => b[1] - a[1]);

            const topIngredients = sortedIngredients.slice(0, 3).map(([name]) => name);
            const topIngredientSet = new Set(topIngredients);

            const candidateDishes = DISHES.filter(dish =>
                !loggedDishIds.has(dish.dish_id) && !loggedDishNames.has(dish.dish_name)
            );
            const pool = candidateDishes.length >= 2 ? candidateDishes : DISHES;

            const rankedSuggestions = pool.map(dish => {
                const familiarMatches = dish.ingredients.filter(ing => topIngredientSet.has(ing));
                const newIngredients = dish.ingredients.filter(ing => !topIngredientSet.has(ing));
                const score = familiarMatches.length * 3 + Math.min(newIngredients.length, 2);
                return { dish, familiarMatches, newIngredients, score };
            }).sort((a, b) => b.score - a.score);

            return {
                recentEntries,
                sortedIngredients,
                topIngredients,
                suggestions: rankedSuggestions.slice(0, 2)
            };
        }

                                        開始探索

                                </div>
                            </div>
                        ` : ''}
                    `}
                </div>

        function renderExplorationResultsSection() {

                <section class="space-y-5 pt-2">

                        <button type="button" onclick="runDishExploration()" class="self-start sm:self-auto px-4 py-2 rounded-xl bg-cream-100 hover:bg-cream-200 text-cocoa-900 text-xs font-semibold inline-flex items-center gap-1.5 transition-colors cursor-pointer">

                                <article onclick="openDishDetail('${dish.dish_id}')" class="cursor-pointer bg-white rounded-3xl border border-cream-200 overflow-hidden card-shadow card-hover flex flex-col justify-between">

        function toggleIngredientSelect(ingName) {
            state.noPreferenceMode = false;

            } else {
                state.selectedIngredients.push(ingName);
            }
            render();
        }

        function selectContext(contextName) {
            state.selectedContext = state.selectedContext === contextName ? '' : contextName;
            render();

            state.noPreferenceMode = checked;
            if (checked) {
                state.selectedIngredients = [];

            render();
        }

            state.selectedIngredients = [];
            state.selectedContext = '';
            state.noPreferenceMode = false;
            state.explorationResults = null;
            render();
        }

        function runDishExploration() {
            state.explorationResults = getRecommendedDishes({
                selectedIngredients: state.selectedIngredients,
                selectedContext: state.selectedContext,
                noPreference: state.noPreferenceMode,
                limit: 3
            });
            render();
            const resultsEl = document.getElementById('exploration-results-container');
            if (resultsEl) {
                resultsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });

            render();

            render();

            render();

            state.storyViewMode = mode;
            if (mode === 'creators') {
                state.selectedStoryCreatorId = null;
            }
            render();
        }

        function findRelatedDishesForCreator(creator) {
            const idList = creator.relatedDishIds || [];
            return idList
                .map(id => DISHES.find(d => d.dish_id === id))
                .filter(Boolean);
        }

        function jumpToRelatedDishesFromCreator(creatorId) {
            const creator = FICTIONAL_STORY_CREATORS.find(c => c.id === creatorId);
            const firstDish = creator ? findRelatedDishesForCreator(creator)[0] : null;
            state.exploreSubMode = 'guided';
            if (firstDish && firstDish.ingredients && firstDish.ingredients.length > 0) {
                const knownIngs = new Set(INGREDIENTS.map(i => i.ingredient_name));
                const matched = firstDish.ingredients.filter(ing => knownIngs.has(ing)).slice(0, 2);
                state.noPreferenceMode = false;
                state.selectedIngredients = matched;
                state.selectedContext = firstDish.context || '';
                state.currentRoute = 'explore';
                runDishExploration();
            } else {
                navigateTo('explore');
            }

        function handleDiaryPhotoUpload(inputEl) {
            const file = inputEl && inputEl.files && inputEl.files[0];
            if (!file) return;

            if (!file.type || !file.type.startsWith('image/')) {
                showToast('請選擇圖片檔案（JPG、PNG 或 WebP）', 'error');
                inputEl.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 960;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width >= height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    if (ctx) {
                        ctx.drawImage(img, 0, 0, width, height);
                        let dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        if (dataUrl.length > 750000) {
                            dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                        }
                        state.diaryPhotoData = dataUrl;
                        state.diaryPhotoNote = '';
                        render();
                        showToast('已載入料理照片');
                    }
                };
                img.onerror = function() {
                    showToast('無法讀取此圖片，請改用其他照片', 'error');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function saveDiaryEntry(event) {
            if (event) event.preventDefault();
            const dishName = (state.diaryDishName || '').trim();
            if (!dishName) {
                showToast('請先填寫料理或食物名稱', 'error');

            const dateVal = state.diaryDate || getTodayStr();
            const storyVal = (state.diaryStory || '').trim();
            const tagsVal = normalizeTagList(state.diaryTags);
            const matchedDish = DISHES.find(d => d.dish_name === dishName);

            if (state.editingEntryId) {
                const idx = state.diaryEntries.findIndex(e => e.id === state.editingEntryId);
                if (idx >= 0) {
                    const prev = state.diaryEntries[idx];
                    state.diaryEntries[idx] = {
                        ...prev,
                        date: dateVal,
                        meal_type: state.diaryMealType || prev.meal_type || '晚餐',
                        dish_name: dishName,
                        matched_dish_id: matchedDish ? matchedDish.dish_id : (prev.matched_dish_id || null),
                        ingredients: matchedDish ? [...matchedDish.ingredients] : (prev.ingredients || []),
                        story: storyVal,
                        notes: storyVal,
                        tags: tagsVal,
                        photo: state.diaryPhotoData || null

            const saveResult = saveDiaryEntries();
            if (!saveResult.ok) {
                showToast('瀏覽器儲存空間已滿，部分內容可能無法保留', 'error');

            }

            state.diaryTags = [];
            state.diaryCustomTagInput = '';
            state.diaryPhotoData = '';
            state.diaryPhotoNote = '';

                            <div class="pt-3 border-t border-cream-200 flex items-center justify-between text-[11px] text-cocoa-700">
                                <span>認識食材，探索料理，建立自己的飲食文化。</span>
                                <span class="font-semibold text-terracotta-600">Food Discovery</span>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col-reverse sm:flex-row sm:flex-wrap sm:items-center sm:justify-end gap-2.5 sm:gap-3">
                        <button type="button" onclick="closeShareCardModal()"
                            class="w-full sm:w-auto px-4 py-3 sm:py-2.5 rounded-2xl bg-white hover:bg-cream-100 text-cocoa-900 border border-cream-200 text-sm font-semibold cursor-pointer">
                            返回日記
                        </button>
                        <button type="button" onclick="downloadShareCardPng('${escapeHTML(entry.id)}', 'download')"
                            class="w-full sm:w-auto px-6 py-3 sm:py-2.5 rounded-2xl ${showNativeShare ? 'bg-white hover:bg-cream-100 text-cocoa-900 border border-cream-200' : 'bg-terracotta-500 hover:bg-terracotta-600 text-white shadow-sm'} text-sm font-bold inline-flex items-center justify-center gap-2 cursor-pointer">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            <span>下載分享卡</span>
                        </button>
                        ${showNativeShare ? `
                            <button type="button" onclick="downloadShareCardPng('${escapeHTML(entry.id)}', 'share')"
                                class="w-full sm:w-auto px-6 py-3 sm:py-2.5 rounded-2xl bg-terracotta-500 hover:bg-terracotta-600 text-white text-sm font-bold inline-flex items-center justify-center gap-2 shadow-sm cursor-pointer">
                                <i data-lucide="share-2" class="w-4 h-4"></i>
                                <span>分享／存到相簿</span>
                            </button>
                        ` : ''}
                    </div>
                </div>
            `;

            modal.classList.remove('hidden');
            content.scrollTop = 0;
            modal.scrollTop = 0;
            syncBodyScrollLock();
            lucide.createIcons();
        }

        function closeShareCardModal() {
            const modal = document.getElementById('share-card-modal');
            if (modal) modal.classList.add('hidden');
            syncBodyScrollLock();
        }

        function wrapCanvasText(ctx, text, maxWidth) {
            const paragraphs = String(text || '').split('\n');
            const lines = [];
            paragraphs.forEach(para => {
                if (!para) {
                    lines.push('');
                    return;
                }
                let current = '';
                for (let i = 0; i < para.length; i++) {
                    const testLine = current + para[i];
                    if (ctx.measureText(testLine).width > maxWidth && current.length > 0) {
                        lines.push(current);
                        current = para[i];
                    } else {
                        current = testLine;
                    }
                }
                if (current) lines.push(current);
            });
            return lines;
        }

        function drawRoundedRectPath(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function renderShareCardToCanvas(entry, loadedPhotoImg) {
            const width = 900;
            const padding = 56;
            const contentWidth = width - padding * 2;
            const hasPhoto = Boolean(loadedPhotoImg);
            const photoHeight = hasPhoto ? 460 : 160;
            const storyText = entry.story || entry.notes || '記錄這一餐的味道與生活片刻。';
            const tags = Array.isArray(entry.tags) ? entry.tags : [];

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.font = '400 26px "Noto Sans TC", sans-serif';
            const storyLines = wrapCanvasText(tempCtx, storyText, contentWidth);

            let tagRows = 0;
            if (tags.length > 0) {
                tempCtx.font = '600 20px "Noto Sans TC", sans-serif';
                let rowW = 0;
                tagRows = 1;
                tags.forEach(t => {
                    const pillW = tempCtx.measureText(`#${t}`).width + 36 + 12;
                    if (rowW + pillW > contentWidth && rowW > 0) {
                        tagRows += 1;
                        rowW = pillW;
                    } else {
                        rowW += pillW;
                    }
                });
            }

            const bodyTop = photoHeight + 48;
            const titleHeight = 52;
            const storyHeight = Math.max(44, storyLines.length * 40 + 20);
            const tagsHeight = tagRows > 0 ? tagRows * 46 + 16 : 0;
            const footerHeight = 92;
            const totalHeight = bodyTop + titleHeight + storyHeight + tagsHeight + footerHeight;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = totalHeight;
            const ctx = canvas.getContext('2d');

            // Card background
            ctx.fillStyle = '#FAF7F2';
            ctx.fillRect(0, 0, width, totalHeight);

            // Top visual area
            if (hasPhoto) {
                const imgRatio = loadedPhotoImg.width / loadedPhotoImg.height;
                const boxRatio = width / photoHeight;
                let drawW = width;
                let drawH = photoHeight;
                let offsetX = 0;
                let offsetY = 0;

                if (imgRatio > boxRatio) {
                    drawH = photoHeight;
                    drawW = photoHeight * imgRatio;
                    offsetX = (width - drawW) / 2;
                } else {
                    drawW = width;
                    drawH = width / imgRatio;
                    offsetY = (photoHeight - drawH) / 2;
                }
                ctx.drawImage(loadedPhotoImg, offsetX, offsetY, drawW, drawH);
            } else {
                const grad = ctx.createLinearGradient(0, 0, width, photoHeight);
                grad.addColorStop(0, '#E1EAE2');
                grad.addColorStop(0.5, '#F3EDE3');
                grad.addColorStop(1, '#FAE4D7');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, photoHeight);

                ctx.fillStyle = '#3A4F3C';
                ctx.font = '700 18px "Noto Sans TC", sans-serif';
                ctx.fillText('FOOD STORY', padding, 74);

                ctx.fillStyle = '#2F2A24';
                ctx.font = '700 28px "Noto Sans TC", sans-serif';
                ctx.fillText(entry.date || getTodayStr(), padding, 114);
            }

            // Date & Brand meta row
            let cursorY = bodyTop;
            ctx.fillStyle = '#6A6156';
            ctx.font = '500 20px "Noto Sans TC", sans-serif';
            ctx.fillText(`${entry.date || getTodayStr()}  •  ${entry.meal_type || '飲食紀錄'}`, padding, cursorY);

            ctx.fillStyle = '#4A634C';
            ctx.font = '700 20px "Noto Sans TC", sans-serif';
            const brandLabel = 'Food Discovery｜食物探索';
            ctx.fillText(brandLabel, width - padding - ctx.measureText(brandLabel).width, cursorY);

            // Dish Title
            cursorY += 48;
            ctx.fillStyle = '#2F2A24';
            ctx.font = '700 38px "Noto Sans TC", sans-serif';
            const titleLines = wrapCanvasText(ctx, entry.dish_name, contentWidth);
            titleLines.forEach((line, idx) => {
                ctx.fillText(line, padding, cursorY + idx * 46);
            });
            cursorY += titleLines.length * 46 + 16;

            // Story Body
            ctx.fillStyle = '#474038';
            ctx.font = '400 25px "Noto Sans TC", sans-serif';
            storyLines.forEach(line => {
                ctx.fillText(line, padding, cursorY);
                cursorY += 38;
            });
            cursorY += 12;

            // Tags
            if (tags.length > 0) {
                ctx.font = '600 20px "Noto Sans TC", sans-serif';
                let xPos = padding;
                tags.forEach(tag => {
                    const label = `#${tag}`;
                    const pillW = ctx.measureText(label).width + 32;
                    const pillH = 38;
                    if (xPos + pillW > width - padding && xPos > padding) {
                        xPos = padding;
                        cursorY += 48;
                    }
                    ctx.fillStyle = '#E1EAE2';
                    drawRoundedRectPath(ctx, xPos, cursorY - 26, pillW, pillH, 19);
                    ctx.fill();

                    ctx.fillStyle = '#3A4F3C';
                    ctx.fillText(label, xPos + 16, cursorY);
                    xPos += pillW + 12;
                });
                cursorY += 52;
            }

            // Footer line & branding
            const footerY = totalHeight - 44;
            ctx.strokeStyle = '#E8E2D7';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(padding, footerY - 28);
            ctx.lineTo(width - padding, footerY - 28);
            ctx.stroke();

            ctx.fillStyle = '#6A6156';
            ctx.font = '400 18px "Noto Sans TC", sans-serif';
            ctx.fillText('認識食材，探索料理，建立自己的飲食文化。', padding, footerY);

            ctx.fillStyle = '#C26536';
            ctx.font = '700 18px "Noto Sans TC", sans-serif';
            const rightTag = 'Food Discovery';
            ctx.fillText(rightTag, width - padding - ctx.measureText(rightTag).width, footerY);

            return canvas;
        }

        let shareCardFontsReady = null;

        function getShareCardFileName(entry) {
            const safeName = (entry.dish_name || 'food-story').replace(/[\\/:*?"<>|]/g, '_');
            return `${safeName}-分享卡.png`;
        }

        function dataUrlToPngFile(dataUrl, fileName) {
            const base64 = dataUrl.split(',')[1] || '';
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new File([bytes], fileName, { type: 'image/png' });
        }

        function canShareImageFiles() {
            try {
                if (!navigator.share || !navigator.canShare) return false;
                const probe = new File([new Uint8Array([0])], 'probe.png', { type: 'image/png' });
                return navigator.canShare({ files: [probe] });
            } catch (e) {
                return false;
            }
        }

        // mode: 'download'（下載 PNG）或 'share'（手機系統分享／存到相簿，失敗時改為下載）
        function downloadShareCardPng(entryId, mode = 'download') {
            const entry = state.diaryEntries.find(e => e.id === entryId);
            if (!entry) return;
            const fileName = getShareCardFileName(entry);

            const triggerDownload = (dataUrl) => {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                link.remove();
                showToast('已下載 PNG 分享卡');
            };

            const handleCanvas = (canvas) => {
                let dataUrl;
                try {
                    dataUrl = canvas.toDataURL('image/png');
                } catch (err) {
                    showToast('匯出圖片時發生問題，請稍後再試', 'error');
                    return;
                }

                if (mode === 'share' && canShareImageFiles()) {
                    const file = dataUrlToPngFile(dataUrl, fileName);
                    navigator.share({ files: [file], title: entry.dish_name || 'Food Discovery 分享卡' })
                        .then(() => showToast('已開啟分享'))
                        .catch(err => {
                            if (err && err.name === 'AbortError') return; // 使用者自行取消
                            triggerDownload(dataUrl);
                        });
                    return;
                }
                triggerDownload(dataUrl);
            };

            const draw = () => {
                if (entry.photo) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => handleCanvas(renderShareCardToCanvas(entry, img));
                    img.onerror = () => handleCanvas(renderShareCardToCanvas(entry, null));
                    img.src = entry.photo;
                } else {
                    handleCanvas(renderShareCardToCanvas(entry, null));
                }
            };

            // 字體已在開啟預覽時預先載入；若尚未完成則最多再等 3 秒
            (shareCardFontsReady || ensureShareCardFontsLoaded(entry)).finally(draw);
        }

        function ensureShareCardFontsLoaded(entry) {
            if (!document.fonts || typeof document.fonts.load !== 'function') {
                return Promise.resolve();
            }
            const tags = Array.isArray(entry.tags) ? entry.tags : [];
            const sampleText = [
                entry.dish_name,
                entry.story || entry.notes || '記錄這一餐的味道與生活片刻。',
                entry.date || '',
                entry.meal_type || '飲食紀錄',
                tags.map(t => `#${t}`).join(' '),
                'Food Discovery｜食物探索 FOOD STORY',
                '認識食材，探索料理，建立自己的飲食文化。'
            ].join(' ');
            const weights = ['400', '500', '600', '700'];
            const loads = weights.map(w =>
                document.fonts.load(`${w} 24px "Noto Sans TC"`, sampleText).catch(() => null)
            );
            const timeout = new Promise(resolve => setTimeout(resolve, 3000));
            return Promise.race([Promise.all(loads), timeout]);
        }

        // =========================================================================
        // 8. MAIN RENDER LOOP & GLOBAL EVENT LISTENERS
        // =========================================================================
        // 即時搜尋輸入：注音／拼音選字期間不重繪，避免打斷輸入法
        function handleLiveSearchInput(el, stateKey) {
            state[stateKey] = el.value;
            if (el.dataset.composing === '1') return;
            render();
        }

        // composition 事件沒有 on* 屬性可用，改以事件委派監聽
        document.addEventListener('compositionstart', (e) => {
            const el = e.target;
            if (el && el.dataset && el.dataset.liveSearch) el.dataset.composing = '1';
        });
        document.addEventListener('compositionend', (e) => {
            const el = e.target;
            if (el && el.dataset && el.dataset.liveSearch) {
                el.dataset.composing = '';
                handleLiveSearchInput(el, el.dataset.liveSearch);
            }
        });

        // 以網址 #hash 記錄目前頁面：手機返回鍵／手勢會回到上一頁，而不是直接離開網站
        const VALID_ROUTES = ['home', 'explore', 'stories', 'ingredients', 'diary'];
        let lastHistoryRoute = null;
        let isRestoringFromHistory = false;

        function getRouteFromHash() {
            const raw = (window.location.hash || '').replace(/^#\/?/, '');
            return VALID_ROUTES.includes(raw) ? raw : null;
        }

        function syncRouteToHistory() {
            const route = state.currentRoute;
            if (route === lastHistoryRoute) return;
            try {
                if (lastHistoryRoute === null || isRestoringFromHistory) {
                    history.replaceState({ route }, '', `#${route}`);
                } else {
                    history.pushState({ route }, '', `#${route}`);
                }
            } catch (e) { /* 部分預覽環境不允許修改網址，忽略 */ }
            lastHistoryRoute = route;
        }

        window.addEventListener('popstate', () => {
            const route = getRouteFromHash() || 'home';
            // 返回時若有彈窗或選單開著，一併關閉
            closeDishDetail();
            closeShareCardModal();
            closeMobileMenu();
            isRestoringFromHistory = true;
            state.currentRoute = route;
            render();
            isRestoringFromHistory = false;
            window.scrollTo({ top: 0 });
        });

        function render() {
            syncRouteToHistory();
            updateActiveNav();
            const app = document.getElementById('app-content');

            // 重繪前記住目前聚焦的輸入框與游標位置，重繪後還原
            const activeEl = document.activeElement;
            const focusKey = activeEl && activeEl.dataset ? activeEl.dataset.focusKey : null;
            let selStart = null;
            let selEnd = null;
            if (focusKey) {
                try {
                    selStart = activeEl.selectionStart;
                    selEnd = activeEl.selectionEnd;
                } catch (e) { /* 部分輸入類型不支援游標位置 */ }
            }

            switch (state.currentRoute) {
                case 'explore':
                    app.innerHTML = renderExploreView();
                    break;
                case 'stories':
                    app.innerHTML = renderFoodStoriesView();
                    break;
                case 'ingredients':
                    app.innerHTML = renderIngredientsView();
                    break;
                case 'diary':
                    app.innerHTML = renderDiaryView();
                    break;
                case 'home':
                default:
                    app.innerHTML = renderHomeView();
                    break;
            }

            lucide.createIcons();

            if (focusKey) {
                const restored = app.querySelector(`[data-focus-key="${focusKey}"]`);
                if (restored) {
                    restored.focus({ preventScroll: true });
                    if (selStart !== null && typeof restored.setSelectionRange === 'function') {
                        try { restored.setSelectionRange(selStart, selEnd); } catch (e) { /* 忽略 */ }
                    }
                }
            }
        }

        document.getElementById('dish-modal').addEventListener('click', function(e) {
            if (e.target === this) closeDishDetail();
        });
        document.getElementById('share-card-modal').addEventListener('click', function(e) {
            if (e.target === this) closeShareCardModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDishDetail();
                closeShareCardModal();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadDiaryEntries();
            const initialRoute = getRouteFromHash();
            if (initialRoute) state.currentRoute = initialRoute;
            render();
        });
    </script>
</body>
