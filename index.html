<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F7F3EC">
    <title>Food Discovery｜食物探索 — 認識食材，探索料理，建立自己的飲食文化</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Noto Sans TC & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;0,800;0,900;1,500;1,600&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"Inter"', 'sans-serif'],
                        serif: ['"Playfair Display"', '"Noto Serif TC"', 'serif'],
                    },
                    colors: {
                        // Warm Cream — 主背景
                        cream: {
                            50: '#FBF8F3',
                            100: '#F7F3EC',
                            200: '#EAE2D4',
                            300: '#D9CDB9',
                        },
                        // Deep Navy — 文字與重點區塊
                        navy: {
                            50: '#E9EEF0',
                            100: '#D2DDE1',
                            600: '#3A5562',
                            700: '#4A5F69',
                            800: '#2A4552',
                            900: '#1B3440',
                        },
                        // Olive Green — 分類標籤（少量使用）
                        olive: {
                            50: '#F3F4E7',
                            100: '#E7EACF',
                            200: '#D3D8AA',
                            500: '#8B963D',
                            600: '#6E7830',
                            700: '#545C24',
                        },
                        // Coral Red — 強調與標籤（少量使用）
                        coral: {
                            50: '#FBEEEA',
                            100: '#F4D8CF',
                            400: '#D98D3E',
                            500: '#C75D45',
                            600: '#A54A35',
                        },
                        // Mustard Yellow — 主要行動按鈕與小型裝飾
                        mustard: {
                            50: '#FEF6DF',
                            100: '#FDEAB3',
                            400: '#FFB923',
                            500: '#F5A900',
                            600: '#D99500',
                        },
                        // Caramel Orange
                        caramel: {
                            100: '#F6E2CC',
                            500: '#D98D3E',
                            600: '#B8722B',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        body {
            background-color: #F7F3EC;
            color: #1B3440;
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "palt" 0;
        }
        /* 編輯式標題：英文 Playfair Display、中文 Noto Serif TC */
        h1, h2, h3, h4, .font-display {
            font-family: "Playfair Display", "Noto Serif TC", serif;
            letter-spacing: -0.01em;
        }
        /* 小標（英文 eyebrow）：小型大寫、加寬字距 */
        .eyebrow {
            font-family: "Inter", "Noto Sans TC", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        .italic-serif {
            font-family: "Playfair Display", "Noto Serif TC", serif;
            font-style: italic;
        }
        /* 芥末黃底線裝飾 */
        .mark-underline {
            background-image: linear-gradient(transparent 62%, rgba(245, 169, 0, 0.55) 62%);
            padding: 0 0.08em;
        }
        .rule-top {
            border-top: 2px solid #1B3440;
        }
        body.modal-open {
            overflow: hidden;
        }
        button, a, label, input, select, textarea {
            touch-action: manipulation;
        }
        /* 編輯式卡片：以細框線取代厚重陰影 */
        .card-shadow {
            box-shadow: none;
        }
        .card-hover {
            transition: border-color 0.2s ease;
        }
        .card-hover img {
            transition: transform 0.5s ease;
        }
        /* 只在有滑鼠的裝置使用 hover 效果，避免手機點擊後卡在 hover 狀態 */
        @media (hover: hover) and (pointer: fine) {
            .card-hover:hover {
                border-color: #1B3440;
            }
            .card-hover:hover img {
                transform: scale(1.03);
            }
        }
        .card-hover:active {
            opacity: 0.92;
        }
        /* iOS Safari 對小於 16px 的輸入框會自動放大畫面，手機版統一 16px */
        @media (max-width: 639px) {
            input[type="text"], input[type="search"], input[type="date"], select, textarea {
                font-size: 16px !important;
            }
        }
        input[type="search"]::-webkit-search-cancel-button {
            -webkit-appearance: none;
        }
        .safe-bottom {
            padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }
        .safe-bottom-offset {
            bottom: max(1rem, env(safe-area-inset-bottom));
        }
        .modal-sheet {
            max-height: 92vh;
            max-height: 92dvh;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        @media (min-width: 640px) {
            .modal-sheet {
                max-height: none;
                overflow: hidden;
            }
        }
        /* 手機版底部彈出面板上方的拖曳提示條 */
        .sheet-handle {
            width: 40px;
            height: 4px;
            border-radius: 9999px;
            background: rgba(27, 52, 64, 0.2);
            margin: 10px auto 0;
        }
        @media (min-width: 640px) {
            .sheet-handle { display: none; }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

    <script>
        // =========================================================================
        // 1. UTILITY HELPERS
        // =========================================================================
        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgColor = type === 'error' ? 'bg-coral-600 text-white' : 'bg-navy-900 text-cream-50';
            toast.className = `${bgColor} px-4 py-3 rounded-md shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 transition-all`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(6px)';
                setTimeout(() => toast.remove(), 220);
            }, 2600);
        }

        function getTodayStr() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getDateDaysAgoStr(daysAgo) {
            const dt = new Date();
            dt.setDate(dt.getDate() - daysAgo);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        // =========================================================================
        // 2. DISH IMAGE MAPPING (GitHub Raw Assets, remapped by photo content + Consistent Placeholder)
        // =========================================================================
        // 注意：GitHub 上的圖檔是依「舊版料理清單」編號，與目前 DISHES 的 dish_id 不同，
        // 以下依照片實際內容對應（例如番茄炒蛋 D02 的照片檔名是 D04.jpg）。
        // 沒有對應照片的料理會自動使用 renderConsistentPlaceholder() 占位卡。
        const DISH_IMAGE_BASE = "https://raw.githubusercontent.com/nickwang1030-design/-food-discovery/main/";
        const DISH_IMAGE_URLS = {
            D01: DISH_IMAGE_BASE + "D01.jpg", // 日式親子丼
            D02: DISH_IMAGE_BASE + "D04.jpg", // 番茄炒蛋
            D03: DISH_IMAGE_BASE + "D06.jpg", // 馬鈴薯燉肉
            D05: DISH_IMAGE_BASE + "D02.jpg", // 香菇雞湯
            D06: DISH_IMAGE_BASE + "D05.jpg", // 麻婆豆腐
            D08: DISH_IMAGE_BASE + "D10.jpg"  // 越式雞肉河粉（原圖僅 300×225，建議日後換高解析版）
            // 尚無對應照片：D04 高麗菜炒豬肉、D07 韓式豆腐鍋、D09 泰式綠咖哩雞、D10 印尼炒飯、D11～D25
            // 儲存庫中未使用的圖：D03.jpg 韓式雞肉拌飯、D07.jpg 高麗菜豬肉鍋、D08.jpg 番茄豆腐湯、D09.jpg 泰式打拋豬
        };

        // 依料理文化給予編輯風格的色塊（取自品牌色票）
        const CUISINE_TONES = {
            '日本': { bg: '#F4D8CF', fg: '#1B3440', accent: '#C75D45' },
            '台灣': { bg: '#FDEAB3', fg: '#1B3440', accent: '#D98D3E' },
            '中國': { bg: '#C75D45', fg: '#F7F3EC', accent: '#F5A900' },
            '韓國': { bg: '#F6E2CC', fg: '#1B3440', accent: '#C75D45' },
            '越南': { bg: '#E7EACF', fg: '#1B3440', accent: '#8B963D' },
            '泰國': { bg: '#8B963D', fg: '#F7F3EC', accent: '#F5A900' },
            '印尼': { bg: '#D98D3E', fg: '#1B3440', accent: '#F7F3EC' },
            '馬來西亞': { bg: '#F5A900', fg: '#1B3440', accent: '#C75D45' },
            '菲律賓': { bg: '#D2DDE1', fg: '#1B3440', accent: '#D98D3E' },
            '新加坡': { bg: '#FBEEEA', fg: '#1B3440', accent: '#C75D45' },
            '義大利': { bg: '#1B3440', fg: '#F7F3EC', accent: '#F5A900' },
            '法國': { bg: '#E9EEF0', fg: '#1B3440', accent: '#8B963D' },
            '西班牙': { bg: '#C75D45', fg: '#F7F3EC', accent: '#FDEAB3' },
            '美國': { bg: '#F6E2CC', fg: '#1B3440', accent: '#1B3440' },
            '墨西哥': { bg: '#545C24', fg: '#F7F3EC', accent: '#F5A900' },
            '英國': { bg: '#2A4552', fg: '#F7F3EC', accent: '#D98D3E' }
        };

        function getCuisineTone(cuisine) {
            return CUISINE_TONES[cuisine] || { bg: '#EAE2D4', fg: '#1B3440', accent: '#C75D45' };
        }

        function renderConsistentPlaceholder(dish, size = 'card') {
            const isCompact = size === 'thumb';
            const tone = getCuisineTone(dish.cuisine);
            const firstChar = Array.from(String(dish.dish_name || '食'))[0];

            if (isCompact) {
                return `
                    <div class="w-full h-full flex items-center justify-center select-none" style="background:${tone.bg};color:${tone.fg};">
                        <span class="font-display text-2xl font-black leading-none">${escapeHTML(firstChar)}</span>
                    </div>
                `;
            }

            return `
                <div class="w-full h-full relative overflow-hidden select-none flex flex-col justify-between p-4 sm:p-5" style="background:${tone.bg};color:${tone.fg};">
                    <span aria-hidden="true" class="absolute -right-3 -bottom-8 font-display font-black leading-none opacity-[0.13]" style="font-size:9rem;">${escapeHTML(firstChar)}</span>
                    <span aria-hidden="true" class="absolute right-4 top-4 w-9 h-9 rounded-full border-2" style="border-color:${tone.accent};"></span>
                    <span aria-hidden="true" class="absolute right-[1.6rem] top-[1.6rem] w-2.5 h-2.5 rounded-full" style="background:${tone.accent};"></span>
                    <span class="eyebrow relative">${escapeHTML(dish.cuisine)} · ${escapeHTML(dish.cooking_method)}</span>
                    <div class="relative">
                        <div class="font-display text-xl sm:text-2xl font-bold leading-tight">${escapeHTML(dish.dish_name)}</div>
                        <div class="text-[11px] mt-1 opacity-80">照片準備中</div>
                    </div>
                </div>
            `;
        }

        function renderDishIllustration(dish, size = 'card') {
            const imageUrl = DISH_IMAGE_URLS[dish.dish_id];
            const isCompact = size === 'thumb';

            if (imageUrl) {
                return `
                    <div class="relative w-full h-full bg-cream-100 overflow-hidden">
                        <img
                            src="${escapeHTML(imageUrl)}"
                            alt="${escapeHTML(dish.dish_name)}"
                            loading="lazy"
                            onerror="this.style.display='none'; this.nextElementSibling.classList.remove('hidden');"
                            class="w-full h-full object-cover"
                        />
                        <div class="hidden w-full h-full">
                            ${renderConsistentPlaceholder(dish, size)}
                        </div>
                        ${!isCompact ? `
                            <span class="absolute top-3 left-3 px-2.5 py-1 bg-cream-100 text-navy-900 eyebrow">
                                ${escapeHTML(dish.cuisine)}
                            </span>
                        ` : ''}
                    </div>
                `;
            }

            return renderConsistentPlaceholder(dish, size);
        }

        // =========================================================================
        // 2.5 INGREDIENT ILLUSTRATIONS（30 種食材的扁平插畫，以 SVG 繪製，無外部圖片）
        // =========================================================================
        const ART_STROKE = 'stroke="#1B3440" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
        const INGREDIENT_ART = {
            // 雞肉：雞腿
            I001: `<path d="M51 60 L66 76" stroke="#1B3440" stroke-width="10" stroke-linecap="round"/>
                   <path d="M51 60 L66 76" stroke="#FBF8F3" stroke-width="4.5" stroke-linecap="round"/>
                   <circle cx="64" cy="81" r="5" fill="#FBF8F3" ${ART_STROKE}/>
                   <circle cx="71" cy="74" r="5" fill="#FBF8F3" ${ART_STROKE}/>
                   <path d="M30 60 C18 47 27 25 46 23 C64 21 74 37 67 53 C63 62 55 65 48 62 C42 66 35 65 30 60 Z" fill="#D98D3E" ${ART_STROKE}/>

        function normalizeTagList(rawTags) {
            if (!Array.isArray(rawTags)) return [];
            const seen = new Set();
            const result = [];
            rawTags.forEach(item => {
                if (typeof item !== 'string') return;
                const cleaned = item.trim().replace(/^#+/, '').trim();
                if (!cleaned) return;
                if (!seen.has(cleaned)) {
                    seen.add(cleaned);
                    result.push(cleaned);
                }
            });
            return result;
        }

        function normalizeDiaryEntry(raw) {
            if (!raw || typeof raw !== 'object') return null;
            const dishName = String(raw.dish_name || '').trim();
            if (!dishName) return null;

            const legacyNotes = String(raw.notes || '').trim();
            const story = raw.story !== undefined && raw.story !== null
                ? String(raw.story).trim()
                : legacyNotes;

            // 餐別獨立存放於 meal_type，不再混入標籤；並移除舊版自動合併進來的餐別標籤
            const mealTypeStr = raw.meal_type ? String(raw.meal_type).trim() : '';
            const mergedTags = normalizeTagList(Array.isArray(raw.tags) ? raw.tags : [])
                .filter(tag => !mealTypeStr || tag !== mealTypeStr);

            return {
                id: raw.id || `entry_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                date: raw.date || getTodayStr(),
                meal_type: raw.meal_type || '晚餐',
                dish_name: dishName,
                matched_dish_id: raw.matched_dish_id || null,
                ingredients: Array.isArray(raw.ingredients) ? raw.ingredients : [],
                story: story,
                notes: story,
                tags: mergedTags,
                photo: typeof raw.photo === 'string' && raw.photo ? raw.photo : null
            };
        }

        function loadDiaryEntries() {
            try {
                const rawV2 = localStorage.getItem(DIARY_STORAGE_KEY);
                let parsed = null;
                if (rawV2) {
                    parsed = JSON.parse(rawV2);
                } else {
                    const rawLegacy = localStorage.getItem('food_discovery_diary_records_v1') || localStorage.getItem('food_diary_entries');
                    if (rawLegacy) {
                        parsed = JSON.parse(rawLegacy);
                    }
                }
                if (Array.isArray(parsed)) {
                    state.diaryEntries = parsed.map(normalizeDiaryEntry).filter(Boolean);
                    return;
                }
            } catch (e) {
                console.warn('讀取飲食日記紀錄時發生問題：', e);
            }
            state.diaryEntries = [];
        }

        function saveDiaryEntries() {
            try {
                localStorage.setItem(DIARY_STORAGE_KEY, JSON.stringify(state.diaryEntries));
                return { ok: true, strippedPhoto: false };
            } catch (e) {
                const isQuota = e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014);
                if (isQuota) {
                    try {
                        const withoutPhotos = state.diaryEntries.map(item => ({

                            photo: null
                        }));
                        localStorage.setItem(DIARY_STORAGE_KEY, JSON.stringify(withoutPhotos));
                        state.diaryEntries = withoutPhotos;
                        return { ok: true, strippedPhoto: true };
                    } catch (retryErr) {

        // =========================================================================
        // 6. RECOMMENDATION ENGINE & 7-DAY DIARY ANALYTICS
        // =========================================================================
        function scoreDish(dish, selectedIngredients, selectedContext) {
            let score = 0;
            const matchedIngredients = [];

            selectedIngredients.forEach(ingName => {
                if (dish.ingredients.includes(ingName)) {
                    score += 3;
                    matchedIngredients.push(ingName);
                } else if (dish.extra_ingredients && dish.extra_ingredients.includes(ingName)) {
                    score += 1;
                    matchedIngredients.push(`${ingName}（配料）`);
                }
            });

            const contextMatched = Boolean(selectedContext && dish.context === selectedContext);
            if (contextMatched) {
                score += 2;
            }

            return {
                dish,
                score,
                matchedIngredients,
                contextMatched
            };
        }

        function getRecommendedDishes({ selectedIngredients = [], selectedContext = '', noPreference = false, limit = 3 }) {
            if (noPreference) {
                const shuffled = [...DISHES].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, limit).map(dish => ({
                    dish,
                    score: 1,
                    matchedIngredients: [],
                    contextMatched: Boolean(selectedContext && dish.context === selectedContext),
                    isRandomDiscovery: true
                }));
            }

            const scored = DISHES.map(dish => scoreDish(dish, selectedIngredients, selectedContext));
            const filtered = scored.filter(item => {
                if (selectedIngredients.length > 0 && selectedContext) {
                    return item.matchedIngredients.length > 0 || item.contextMatched;
                }
                if (selectedIngredients.length > 0) {
                    return item.matchedIngredients.length > 0;
                }
                if (selectedContext) {
                    return item.contextMatched;
                }
                return true;
            });

            filtered.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                if (b.matchedIngredients.length !== a.matchedIngredients.length) {
                    return b.matchedIngredients.length - a.matchedIngredients.length;
                }
                return a.dish.cooking_time - b.dish.cooking_time;
            });

            if (filtered.length === 0) {
                return [...DISHES]
                    .sort((a, b) => a.cooking_time - b.cooking_time)
                    .slice(0, limit)
                    .map(dish => ({
                        dish,
                        score: 0,
                        matchedIngredients: [],
                        contextMatched: false,
                        isFallback: true
                    }));
            }

            return filtered.slice(0, limit);
        }

        function analyzeRecent7DaysDiary() {
            const cutoffStr = getDateDaysAgoStr(6);
            const recentEntries = state.diaryEntries.filter(entry => entry.date >= cutoffStr);

            const ingredientCounts = {};
            const loggedDishIds = new Set();
            const loggedDishNames = new Set();

            recentEntries.forEach(entry => {
                if (entry.matched_dish_id) loggedDishIds.add(entry.matched_dish_id);
                if (entry.dish_name) loggedDishNames.add(entry.dish_name.trim());

                let entryIngs = Array.isArray(entry.ingredients) ? [...entry.ingredients] : [];
                if (entryIngs.length === 0 && entry.matched_dish_id) {
                    const matched = DISHES.find(d => d.dish_id === entry.matched_dish_id);
                    if (matched) entryIngs = [...matched.ingredients];
                }
                if (entryIngs.length === 0 && entry.dish_name) {
                    const byName = DISHES.find(d => d.dish_name === entry.dish_name.trim());
                    if (byName) entryIngs = [...byName.ingredients];
                }
                if (entryIngs.length === 0 && Array.isArray(entry.tags)) {
                    const knownIngSet = new Set(INGREDIENTS.map(i => i.ingredient_name));
                    entryIngs = entry.tags.filter(t => knownIngSet.has(t));
                }

                entryIngs.forEach(ing => {
                    ingredientCounts[ing] = (ingredientCounts[ing] || 0) + 1;
                });
            });

            const sortedIngredients = Object.entries(ingredientCounts)
                .sort((a, b) => b[1] - a[1]);

            const topIngredients = sortedIngredients.slice(0, 3).map(([name]) => name);
            const topIngredientSet = new Set(topIngredients);

            const candidateDishes = DISHES.filter(dish =>
                !loggedDishIds.has(dish.dish_id) && !loggedDishNames.has(dish.dish_name)
            );
            const pool = candidateDishes.length >= 2 ? candidateDishes : DISHES;

            const rankedSuggestions = pool.map(dish => {
                const familiarMatches = dish.ingredients.filter(ing => topIngredientSet.has(ing));
                const newIngredients = dish.ingredients.filter(ing => !topIngredientSet.has(ing));
                const score = familiarMatches.length * 3 + Math.min(newIngredients.length, 2);
                return { dish, familiarMatches, newIngredients, score };
            }).sort((a, b) => b.score - a.score);

            return {
                recentEntries,
                sortedIngredients,
                topIngredients,
                suggestions: rankedSuggestions.slice(0, 2)
            };
        }

        // --- 7.2 EXPLORE VIEW (GUIDED EXPLORATION + BROWSE ALL 25 DISHES BY CUISINE) ---

            categoryOrder.forEach(cat => {

                                    ? '自由瀏覽收錄的 25 道跨國料理，依國家篩選或點擊查看詳情。'
                                    : '選擇想吃的食材與用餐情境，或直接探索靈感，找出最適合今天的料理。'}
                            </p>
                        </div>

                        <div class="inline-flex rounded-full bg-cream-200 p-1 self-start md:self-auto">
                            <button type="button" onclick="switchExploreSubMode('guided')"

                                    ? 'bg-navy-900 text-cream-50'
                                    : 'text-navy-800 hover:bg-cream-200'
                                }">
                                依食材與情境探索
                            </button>
                            <button type="button" onclick="switchExploreSubMode('all')"
                                class="px-4 py-2 rounded-full text-xs sm:text-sm font-semibold transition-all cursor-pointer ${
                                    state.exploreSubMode === 'all'
                                    ? 'bg-navy-900 text-cream-50'
                                    : 'text-navy-800 hover:bg-cream-200'
                                }">
                                瀏覽全部料理 (${DISHES.length})
                            </button>
                        </div>
                    </div>

                    ${state.exploreSubMode === 'all' ? `
                        <!-- Browse All 25 Dishes Mode -->
                        <section class="space-y-5">
                            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1 -mx-4 px-4 sm:mx-0 sm:px-0 scroll-px-4">
                                ${cuisineOptions.map(c => {
                                    const active = state.allDishesCuisine === c;
                                    const count = c === '全部' ? DISHES.length : DISHES.filter(d => d.cuisine === c).length;
                                    return `
                                        <button type="button" onclick="setAllDishesCuisine('${escapeHTML(c)}')"
                                            class="px-3.5 py-2 rounded-md text-xs sm:text-sm font-semibold border transition-colors cursor-pointer shrink-0 ${
                                                active
                                                ? 'bg-navy-900 text-cream-50 border-navy-900'
                                                : 'bg-cream-50 text-navy-900 border-cream-200 hover:bg-cream-100'
                                            }">
                                            ${escapeHTML(c)} (${count})

                                                active

                                                <div class="w-9 h-9 rounded-full ${active ? 'bg-navy-900 text-mustard-500' : 'bg-cream-200 text-navy-900'} flex items-center justify-center">

                                            </div>

                                }).join('')}

                            </div>

                    `}

        function closeDishDetail() {
            const modal = document.getElementById('dish-modal');
            if (modal) modal.classList.add('hidden');

        function copyShoppingList(dishName, items) {
            const list = Array.isArray(items) ? items : [];
            const text = `【${dishName}】食材清單：\n${list.map(i => `• ${i}`).join('\n')}`;

            const fallbackCopy = () => {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    showToast(`已複製「${dishName}」食材清單`);
                } catch (err) {
                    showToast('複製失敗，請手動選取複製', 'error');
                }
                ta.remove();
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(
                    () => showToast(`已複製「${dishName}」食材清單`),
                    fallbackCopy
                );
            } else {
                fallbackCopy();
            }
        }

                    dish_name: dish.dish_name,
                    matched_dish_id: dish.dish_id,
                    ingredients: [...dish.ingredients],
                    tags: [dish.cuisine, dish.context]
                }
            });
            showToast(`已帶入「${dish.dish_name}」至飲食日記表單`);

            state.diaryPhotoData = '';
            state.diaryPhotoNote = '';
            state.prefillDiary = null;
        }

        function addDiaryTag(rawTag) {
            const cleaned = String(rawTag || '').trim().replace(/^#+/, '').trim();
            if (!cleaned) return;
            if (!state.diaryTags.includes(cleaned)) {
                state.diaryTags = [...state.diaryTags, cleaned];
            }
            state.diaryCustomTagInput = '';
            render();
        }

        function removeDiaryTag(tagToRemove) {
            state.diaryTags = state.diaryTags.filter(t => t !== tagToRemove);
            render();
        }

        function handleDiaryPhotoUpload(inputEl) {
            const file = inputEl && inputEl.files && inputEl.files[0];
            if (!file) return;

            if (!file.type || !file.type.startsWith('image/')) {
                showToast('請選擇圖片檔案（JPG、PNG 或 WebP）', 'error');
                inputEl.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = function(evt) {
                const img = new Image();
                img.onload = function() {
                    const maxDim = 960;
                    let width = img.width;
                    let height = img.height;
                    if (width > maxDim || height > maxDim) {
                        if (width >= height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    if (ctx) {
                        ctx.drawImage(img, 0, 0, width, height);
                        let dataUrl = canvas.toDataURL('image/jpeg', 0.82);
                        if (dataUrl.length > 750000) {
                            dataUrl = canvas.toDataURL('image/jpeg', 0.65);
                        }
                        state.diaryPhotoData = dataUrl;
                        state.diaryPhotoNote = '';
                        render();
                        showToast('已載入料理照片');
                    }
                };
                img.onerror = function() {
                    showToast('無法讀取此圖片，請改用其他照片', 'error');
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        }

        function clearDiaryFormPhoto() {
            state.diaryPhotoData = '';
            state.diaryPhotoNote = '';
            render();
        }

        function saveDiaryEntry(event) {
            if (event) event.preventDefault();
            const dishName = (state.diaryDishName || '').trim();
            if (!dishName) {
                showToast('請先填寫料理或食物名稱', 'error');
                return;
            }

            const dateVal = state.diaryDate || getTodayStr();
            const storyVal = (state.diaryStory || '').trim();
            const tagsVal = normalizeTagList(state.diaryTags);
            const matchedDish = DISHES.find(d => d.dish_name === dishName);

            if (state.editingEntryId) {
                const idx = state.diaryEntries.findIndex(e => e.id === state.editingEntryId);
                if (idx >= 0) {
                    const prev = state.diaryEntries[idx];
                    state.diaryEntries[idx] = {
                        ...prev,
                        date: dateVal,
                        meal_type: state.diaryMealType || prev.meal_type || '晚餐',
                        dish_name: dishName,
                        matched_dish_id: matchedDish ? matchedDish.dish_id : (prev.matched_dish_id || null),
                        ingredients: matchedDish ? [...matchedDish.ingredients] : (prev.ingredients || []),
                        story: storyVal,
                        notes: storyVal,
                        tags: tagsVal,
                        photo: state.diaryPhotoData || null
                    };
                }
                state.editingEntryId = null;
                showToast('已更新飲食日記紀錄');
            } else {
                const newEntry = {
                    id: `entry_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
                    date: dateVal,
                    meal_type: state.diaryMealType || '晚餐',
                    dish_name: dishName,
                    matched_dish_id: matchedDish ? matchedDish.dish_id : null,
                    ingredients: matchedDish ? [...matchedDish.ingredients] : [],
                    story: storyVal,
                    notes: storyVal,
                    tags: tagsVal,
                    photo: state.diaryPhotoData || null
                };
                state.diaryEntries.unshift(newEntry);
                showToast('已儲存新的飲食日記');
            }

            const saveResult = saveDiaryEntries();
            if (!saveResult.ok) {
                showToast('瀏覽器儲存空間已滿，部分內容可能無法保留', 'error');
            } else if (saveResult.strippedPhoto) {
                showToast('因瀏覽器儲存容量限制，已保留文字與標籤紀錄但移除照片', 'error');
            }

            state.diaryDishName = '';
            state.diaryStory = '';
            state.diaryTags = [];
            state.diaryCustomTagInput = '';
            state.diaryPhotoData = '';
            state.diaryPhotoNote = '';
            render();
        }

        function startEditDiaryEntry(entryId) {
            const target = state.diaryEntries.find(e => e.id === entryId);
            if (!target) return;
            state.editingEntryId = target.id;
            state.diaryDate = target.date || getTodayStr();
            state.diaryMealType = target.meal_type || '晚餐';

        // 刪除需連按兩次確認，避免手機誤觸；3 秒內未確認則還原
        let pendingDeleteTimer = null;
        function requestDeleteDiaryEntry(entryId) {
            if (state.pendingDeleteEntryId === entryId) {
                clearTimeout(pendingDeleteTimer);
                state.pendingDeleteEntryId = null;
                deleteDiaryEntry(entryId);
                return;
            }
            state.pendingDeleteEntryId = entryId;
            clearTimeout(pendingDeleteTimer);
            pendingDeleteTimer = setTimeout(() => {
                if (state.pendingDeleteEntryId === entryId) {
                    state.pendingDeleteEntryId = null;
                    if (state.currentRoute === 'diary') render();
                }
            }, 3000);
            render();
        }

            state.diaryEntries = state.diaryEntries.filter(e => e.id !== entryId);
            if (state.editingEntryId === entryId) {

        function wrapCanvasText(ctx, text, maxWidth) {
            const paragraphs = String(text || '').split('\n');
            const lines = [];
            paragraphs.forEach(para => {
                if (!para) {
                    lines.push('');
                    return;
                }
                let current = '';
                for (let i = 0; i < para.length; i++) {
                    const testLine = current + para[i];
                    if (ctx.measureText(testLine).width > maxWidth && current.length > 0) {
                        lines.push(current);
                        current = para[i];
                    } else {
                        current = testLine;
                    }
                }
                if (current) lines.push(current);
            });
            return lines;
        }

        function drawRoundedRectPath(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.arcTo(x + w, y, x + w, y + h, radius);
            ctx.arcTo(x + w, y + h, x, y + h, radius);
            ctx.arcTo(x, y + h, x, y, radius);
            ctx.arcTo(x, y, x + w, y, radius);
            ctx.closePath();
        }

        function renderShareCardToCanvas(entry, loadedPhotoImg) {
            const C = {
                cream: '#F7F3EC', navy: '#1B3440', navy800: '#2A4552', mustard: '#F5A900',
                coral: '#A54A35', olive: '#545C24', oliveBg: '#E7EACF', cream300: '#D9CDB9'
            };
            const SANS = '"Noto Sans TC", sans-serif';
            const SERIF = '"Playfair Display", "Noto Serif TC", serif';
            const width = 900;
            const padding = 60;
            const contentWidth = width - padding * 2;
            const hasPhoto = Boolean(loadedPhotoImg);
            const bandHeight = 76;
            const visualHeight = hasPhoto ? 520 : 230;
            const storyText = entry.story || entry.notes || '記錄這一餐的味道與生活片刻。';
            const tags = Array.isArray(entry.tags) ? entry.tags : [];
            const dateStr = entry.date || getTodayStr();
            const mealStr = entry.meal_type || '飲食紀錄';

            const measureCanvas = document.createElement('canvas');
            const m = measureCanvas.getContext('2d');
            m.font = `900 50px ${SERIF}`;
            const titleLines = wrapCanvasText(m, entry.dish_name, contentWidth);
            m.font = `400 26px ${SANS}`;
            const storyLines = wrapCanvasText(m, storyText, contentWidth);

            let tagRows = 0;
            if (tags.length > 0) {
                m.font = `600 21px ${SANS}`;
                let rowW = 0;
                tagRows = 1;
                tags.forEach(t => {
                    const pillW = m.measureText(`#${t}`).width + 36 + 12;
                    if (rowW + pillW > contentWidth && rowW > 0) {
                        tagRows += 1;
                        rowW = pillW;
                    } else {
                        rowW += pillW;
                    }
                });
            }

            const bodyTop = bandHeight + visualHeight + 64;
            const metaHeight = 46;
            const titleHeight = titleLines.length * 60 + 8;
            const ruleHeight = 40;
            const storyHeight = storyLines.length * 42 + 16;
            const tagsHeight = tagRows > 0 ? tagRows * 50 + 12 : 0;
            const footerHeight = 120;
            const totalHeight = bodyTop + metaHeight + titleHeight + ruleHeight + storyHeight + tagsHeight + footerHeight;

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = totalHeight;
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = 'alphabetic';

            // 背景
            ctx.fillStyle = C.cream;
            ctx.fillRect(0, 0, width, totalHeight);

            // 頂部深藍色帶
            ctx.fillStyle = C.navy;
            ctx.fillRect(0, 0, width, bandHeight);
            ctx.fillStyle = C.mustard;
            ctx.font = `700 18px ${SANS}`;
            if ('letterSpacing' in ctx) ctx.letterSpacing = '4px';
            ctx.fillText('FOOD STORY', padding, 48);
            if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
            const brandMain = 'Food Discovery';
            const brandSub = ' 食物探索';
            ctx.font = `700 24px ${SERIF}`;
            const brandMainW = ctx.measureText(brandMain).width;
            ctx.font = `600 18px ${SANS}`;
            const brandSubW = ctx.measureText(brandSub).width;
            const brandX = width - padding - brandMainW - brandSubW;
            ctx.fillStyle = C.cream;
            ctx.font = `700 24px ${SERIF}`;
            ctx.fillText(brandMain, brandX, 48);
            ctx.fillStyle = C.mustard;
            ctx.font = `600 18px ${SANS}`;
            ctx.fillText(brandSub, brandX + brandMainW, 48);

            // 主視覺：照片（等比裁切填滿）或芥末黃日期色塊
            if (hasPhoto) {
                const imgRatio = loadedPhotoImg.width / loadedPhotoImg.height;
                const boxRatio = width / visualHeight;
                let drawW = width;
                let drawH = visualHeight;
                let offsetX = 0;
                let offsetY = 0;
                if (imgRatio > boxRatio) {
                    drawH = visualHeight;
                    drawW = visualHeight * imgRatio;
                    offsetX = (width - drawW) / 2;
                } else {
                    drawW = width;
                    drawH = width / imgRatio;
                    offsetY = (visualHeight - drawH) / 2;
                }
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, bandHeight, width, visualHeight);
                ctx.clip();
                ctx.drawImage(loadedPhotoImg, offsetX, bandHeight + offsetY, drawW, drawH);
                ctx.restore();
            } else {
                ctx.fillStyle = C.mustard;
                ctx.fillRect(0, bandHeight, width, visualHeight);
                ctx.fillStyle = C.navy;
                ctx.font = `900 120px ${SERIF}`;
                ctx.fillText(String(dateStr).slice(5).replace('-', '.'), padding, bandHeight + visualHeight - 40);
                ctx.font = `italic 600 30px ${SERIF}`;
                ctx.fillText(mealStr, width - padding - ctx.measureText(mealStr).width, bandHeight + visualHeight - 44);
            }

            // 日期與餐別
            let cursorY = bodyTop;
            ctx.fillStyle = C.coral;
            ctx.font = `700 20px ${SANS}`;
            if ('letterSpacing' in ctx) ctx.letterSpacing = '3px';
            ctx.fillText(`${dateStr}  ·  ${mealStr}`, padding, cursorY);
            if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

            // 料理名稱
            cursorY += metaHeight + 18;
            ctx.fillStyle = C.navy;
            ctx.font = `900 50px ${SERIF}`;
            titleLines.forEach((line, idx) => {
                ctx.fillText(line, padding, cursorY + idx * 60);
            });
            cursorY += (titleLines.length - 1) * 60 + 30;

            // 芥末黃短線
            ctx.fillStyle = C.mustard;
            ctx.fillRect(padding, cursorY, 72, 7);
            cursorY += ruleHeight + 16;

            // 飲食故事
            ctx.fillStyle = C.navy800;
            ctx.font = `400 26px ${SANS}`;
            storyLines.forEach(line => {
                ctx.fillText(line, padding, cursorY);
                cursorY += 42;
            });
            cursorY += 12;

            // 標籤
            if (tags.length > 0) {
                ctx.font = `600 21px ${SANS}`;
                let xPos = padding;
                cursorY += 8;
                tags.forEach(tag => {
                    const label = `#${tag}`;
                    const pillW = ctx.measureText(label).width + 36;
                    const pillH = 40;
                    if (xPos + pillW > width - padding && xPos > padding) {
                        xPos = padding;
                        cursorY += 50;
                    }
                    ctx.fillStyle = C.oliveBg;
                    drawRoundedRectPath(ctx, xPos, cursorY - 28, pillW, pillH, 20);
                    ctx.fill();
                    ctx.fillStyle = C.olive;
                    ctx.fillText(label, xPos + 18, cursorY);
                    xPos += pillW + 12;
                });
                cursorY += 50;
            }

            // 頁尾：深藍粗線＋標語
            const footerY = totalHeight - 52;
            ctx.fillStyle = C.navy;
            ctx.fillRect(padding, footerY - 44, contentWidth, 3);
            ctx.font = `700 21px ${SERIF}`;
            ctx.fillText('認識食材，探索料理，建立自己的飲食文化。', padding, footerY);
            ctx.fillStyle = C.coral;
            ctx.font = `700 19px ${SANS}`;
            const rightTag = 'Food Discovery';
            ctx.fillText(rightTag, width - padding - ctx.measureText(rightTag).width, footerY);

            return canvas;
        }

        let shareCardFontsReady = null;

        function getShareCardFileName(entry) {
            const safeName = (entry.dish_name || 'food-story').replace(/[\\/:*?"<>|]/g, '_');
            return `${safeName}-分享卡.png`;
        }

        function dataUrlToPngFile(dataUrl, fileName) {
            const base64 = dataUrl.split(',')[1] || '';
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new File([bytes], fileName, { type: 'image/png' });
        }

        function canShareImageFiles() {
            try {
                if (!navigator.share || !navigator.canShare) return false;
                const probe = new File([new Uint8Array([0])], 'probe.png', { type: 'image/png' });
                return navigator.canShare({ files: [probe] });
            } catch (e) {
                return false;
            }
        }

        // mode: 'download'（下載 PNG）或 'share'（手機系統分享／存到相簿，失敗時改為下載）
        function downloadShareCardPng(entryId, mode = 'download') {
            const entry = state.diaryEntries.find(e => e.id === entryId);
            if (!entry) return;
            const fileName = getShareCardFileName(entry);

            const triggerDownload = (dataUrl) => {
                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                link.remove();
                showToast('已下載 PNG 分享卡');
            };

            const handleCanvas = (canvas) => {
                let dataUrl;
                try {
                    dataUrl = canvas.toDataURL('image/png');
                } catch (err) {
                    showToast('匯出圖片時發生問題，請稍後再試', 'error');
                    return;
                }

                if (mode === 'share' && canShareImageFiles()) {
                    const file = dataUrlToPngFile(dataUrl, fileName);
                    navigator.share({ files: [file], title: entry.dish_name || 'Food Discovery 分享卡' })
                        .then(() => showToast('已開啟分享'))
                        .catch(err => {
                            if (err && err.name === 'AbortError') return; // 使用者自行取消
                            triggerDownload(dataUrl);
                        });
                    return;
                }
                triggerDownload(dataUrl);
            };

            const draw = () => {
                if (entry.photo) {
                    const img = new Image();
                    img.crossOrigin = 'anonymous';
                    img.onload = () => handleCanvas(renderShareCardToCanvas(entry, img));
                    img.onerror = () => handleCanvas(renderShareCardToCanvas(entry, null));
                    img.src = entry.photo;
                } else {
                    handleCanvas(renderShareCardToCanvas(entry, null));
                }
            };

            // 字體已在開啟預覽時預先載入；若尚未完成則最多再等 3 秒
            (shareCardFontsReady || ensureShareCardFontsLoaded(entry)).finally(draw);
        }

        function ensureShareCardFontsLoaded(entry) {
            if (!document.fonts || typeof document.fonts.load !== 'function') {
                return Promise.resolve();
            }
            const tags = Array.isArray(entry.tags) ? entry.tags : [];
            const sampleText = [
                entry.dish_name,
                entry.story || entry.notes || '記錄這一餐的味道與生活片刻。',
                entry.date || '',
                entry.meal_type || '飲食紀錄',
                tags.map(t => `#${t}`).join(' '),
                'Food Discovery 食物探索 FOOD STORY 0123456789.',
                '認識食材，探索料理，建立自己的飲食文化。'
            ].join(' ');
            const fontSpecs = [
                '400 24px "Noto Sans TC"', '600 24px "Noto Sans TC"', '700 24px "Noto Sans TC"',
                '700 24px "Noto Serif TC"', '900 24px "Noto Serif TC"',
                '700 24px "Playfair Display"', '900 24px "Playfair Display"', 'italic 600 24px "Playfair Display"'
            ];
            const loads = fontSpecs.map(spec =>
                document.fonts.load(spec, sampleText).catch(() => null)
            );
            const timeout = new Promise(resolve => setTimeout(resolve, 3000));
            return Promise.race([Promise.all(loads), timeout]);
        }

        // =========================================================================
        // 8. MAIN RENDER LOOP & GLOBAL EVENT LISTENERS
        // =========================================================================
        // 即時搜尋輸入：注音／拼音選字期間不重繪，避免打斷輸入法
        function handleLiveSearchInput(el, stateKey) {
            state[stateKey] = el.value;
            if (el.dataset.composing === '1') return;
            render();
        }

        // composition 事件沒有 on* 屬性可用，改以事件委派監聽
        document.addEventListener('compositionstart', (e) => {
            const el = e.target;
            if (el && el.dataset && el.dataset.liveSearch) el.dataset.composing = '1';
        });
        document.addEventListener('compositionend', (e) => {
            const el = e.target;
            if (el && el.dataset && el.dataset.liveSearch) {
                el.dataset.composing = '';
                handleLiveSearchInput(el, el.dataset.liveSearch);
            }
        });

        // 以網址 #hash 記錄目前頁面：手機返回鍵／手勢會回到上一頁，而不是直接離開網站
        const VALID_ROUTES = ['home', 'explore', 'stories', 'ingredients', 'diary'];
        let lastHistoryRoute = null;
        let isRestoringFromHistory = false;

        function getRouteFromHash() {
            const raw = (window.location.hash || '').replace(/^#\/?/, '');
            return VALID_ROUTES.includes(raw) ? raw : null;
        }

        function syncRouteToHistory() {
            const route = state.currentRoute;
            if (route === lastHistoryRoute) return;
            try {
                if (lastHistoryRoute === null || isRestoringFromHistory) {
                    history.replaceState({ route }, '', `#${route}`);
                } else {
                    history.pushState({ route }, '', `#${route}`);
                }
            } catch (e) { /* 部分預覽環境不允許修改網址，忽略 */ }
            lastHistoryRoute = route;
        }

        window.addEventListener('popstate', () => {
            const route = getRouteFromHash() || 'home';
            // 返回時若有彈窗或選單開著，一併關閉
            closeDishDetail();
            closeShareCardModal();
            closeMobileMenu();
            isRestoringFromHistory = true;
            state.currentRoute = route;
            render();
            isRestoringFromHistory = false;
            window.scrollTo({ top: 0 });
        });

        function render() {
            syncRouteToHistory();
            updateActiveNav();
            const app = document.getElementById('app-content');

            // 重繪前記住目前聚焦的輸入框與游標位置，重繪後還原
            const activeEl = document.activeElement;
            const focusKey = activeEl && activeEl.dataset ? activeEl.dataset.focusKey : null;
            let selStart = null;
            let selEnd = null;
            if (focusKey) {
                try {
                    selStart = activeEl.selectionStart;
                    selEnd = activeEl.selectionEnd;
                } catch (e) { /* 部分輸入類型不支援游標位置 */ }
            }

            switch (state.currentRoute) {
                case 'explore':
                    app.innerHTML = renderExploreView();
                    break;
                case 'stories':
                    app.innerHTML = renderFoodStoriesView();
                    break;
                case 'ingredients':
                    app.innerHTML = renderIngredientsView();
                    break;
                case 'diary':
                    app.innerHTML = renderDiaryView();
                    break;
                case 'home':
                default:
                    app.innerHTML = renderHomeView();
                    break;
            }

            lucide.createIcons();

            if (focusKey) {
                const restored = app.querySelector(`[data-focus-key="${focusKey}"]`);
                if (restored) {
                    restored.focus({ preventScroll: true });
                    if (selStart !== null && typeof restored.setSelectionRange === 'function') {
                        try { restored.setSelectionRange(selStart, selEnd); } catch (e) { /* 忽略 */ }
                    }
                }
            }
        }

        document.getElementById('dish-modal').addEventListener('click', function(e) {
            if (e.target === this) closeDishDetail();
        });
        document.getElementById('share-card-modal').addEventListener('click', function(e) {
            if (e.target === this) closeShareCardModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeDishDetail();
                closeShareCardModal();
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            loadDiaryEntries();
            const initialRoute = getRouteFromHash();
            if (initialRoute) state.currentRoute = initialRoute;
            render();
        });
    </script>
</body>
</html>
