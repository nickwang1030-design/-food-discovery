        // =========================================================================
        // 5. RECOMMENDATION ENGINE (Section 3.3 Rules)
        // =========================================================================
        function runDishExploration() {
            const selectedIngs = state.noPreferenceMode ? [] : state.selectedIngredients;
            const selectedCtx = state.selectedContext;

            if (!state.noPreferenceMode && selectedIngs.length === 0 && !selectedCtx) {
                showToast('請至少選擇一項食材、勾選「沒有特定想法，讓我探索」，或選擇一個用餐情境。', 'error');
                return;
            }

            const scored = DISHES.map(dish => {
                const matchedIngs = selectedIngs.filter(ing => dish.ingredients.includes(ing));
                const isFullMatch = selectedIngs.length > 0 && matchedIngs.length === selectedIngs.length;
                const isContextMatch = selectedCtx ? dish.context === selectedCtx : false;

                // Scoring Priority:
                // 1. Complete match of all selected ingredients gets highest tier (+1000)
                // 2. Partial matches ranked by higher count of matching ingredients (+120 per match)
                // 3. Dining context acts as a ranking booster (+75), not a mandatory filter
                let score = 0;
                if (selectedIngs.length > 0) {
                    if (isFullMatch) score += 1000;
                    score += matchedIngs.length * 120;
                }
                if (isContextMatch) {
                    score += 75;
                }
                if (selectedIngs.length === 0 && !selectedCtx) {
                    score += 10;
                }

                // Build clear, warm Traditional Chinese recommendation reason
                let dynamicReason = dish.recommendation_reason;
                if (selectedIngs.length > 0) {
                    if (isFullMatch && isContextMatch) {
                        dynamicReason = `完整包含你選擇的「${matchedIngs.join('、')}」，且非常適合「${selectedCtx}」！${dish.recommendation_reason}。`;
                    } else if (isFullMatch) {
                        dynamicReason = `完整包含你選擇的所有食材（${matchedIngs.join('、')}），${dish.recommendation_reason}。`;
                    } else if (matchedIngs.length > 0 && isContextMatch) {
                        dynamicReason = `包含你選擇的「${matchedIngs.join('、')}」，並符合「${selectedCtx}」情境；${dish.recommendation_reason}。`;
                    } else if (matchedIngs.length > 0) {
                        dynamicReason = `包含你選擇的「${matchedIngs.join('、')}」，${dish.recommendation_reason}。`;
                    }
                } else if (isContextMatch) {
                    dynamicReason = `符合「${selectedCtx}」的用餐氛圍：${dish.recommendation_reason}。`;
                }

                return {
                    dish,
                    score,
                    matchedIngs,
                    isFullMatch,
                    isContextMatch,
                    dynamicReason
                };
            });

            // Filter relevant candidates based on rules
            let candidates = [];
            if (selectedIngs.length > 0) {
                // Prioritize dishes matching at least one selected ingredient
                candidates = scored.filter(item => item.matchedIngs.length > 0);
            } else if (selectedCtx) {
                // No ingredients selected: recommend based on selected dining context
                candidates = scored.filter(item => item.isContextMatch);
            } else {
                // "沒有特定想法，讓我探索" with no context selected: explore across all dishes
                candidates = [...scored];
            }

            // Sort by score descending; add gentle shuffle among equal scores for exploration variety
            candidates.sort((a, b) => {
                if (b.score !== a.score) return b.score - a.score;
                return Math.random() - 0.5;
            });

            state.recommendationResults = candidates.slice(0, 3);
            render();

            setTimeout(() => {
                const section = document.getElementById('recommendation-results-section');
                if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 80);
        }

        // =========================================================================
        // 6. 7-DAY FOOD DIARY ANALYTICS & PERSONALIZED EXPLORATION (Section 3.7)
        // =========================================================================
        function analyzeRecentSevenDays() {
            const entries = loadDiaryEntries();
            const now = new Date();
            const sevenDaysAgo = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 6);

            const recentEntries = entries.filter(entry => {
                const parts = (entry.date || '').split('-');
                if (parts.length !== 3) return false;
                const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                return d >= sevenDaysAgo;
            });

            const freqMap = {};
            INGREDIENTS.forEach(ing => {
                freqMap[ing.ingredient_name] = 0;
            });

            recentEntries.forEach(entry => {
                (entry.ingredients || []).forEach(ingName => {
                    freqMap[ingName] = (freqMap[ingName] || 0) + 1;
                });
            });

            const allStats = Object.entries(freqMap).map(([name, count]) => ({
                name,
                count,
                info: INGREDIENTS.find(i => i.ingredient_name === name)
            }));

            const recorded = allStats
                .filter(s => s.count > 0)
                .sort((a, b) => b.count - a.count);

            // Frequent ingredients: appeared >= 2 times, or top 2 recorded if counts are all 1
            let frequent = recorded.filter(s => s.count >= 2);
            if (frequent.length === 0 && recorded.length > 0) {
                frequent = recorded.slice(0, 2);
            }

            const frequentNameSet = new Set(frequent.map(f => f.name));

            // Less frequently recorded ingredients (0 or 1 time, excluding top frequent ones)
            const rareOrUnexplored = allStats
                .filter(s => !frequentNameSet.has(s.name) && s.count <= 1)
                .sort((a, b) => a.count - b.count);

            const rareNameSet = new Set(rareOrUnexplored.map(r => r.name));

            // Personalized recommendation: dishes containing BOTH frequent AND rare/less-recorded ingredients
            let bridgeDishes = [];
            if (recentEntries.length >= 2 && frequent.length > 0 && rareOrUnexplored.length > 0) {
                bridgeDishes = DISHES.map(dish => {
                    const matchedFreq = dish.ingredients.filter(i => frequentNameSet.has(i));
                    const matchedRare = dish.ingredients.filter(i => rareNameSet.has(i));

                    return {
                        dish,
                        matchedFreq,
                        matchedRare,
                        score: (matchedFreq.length > 0 && matchedRare.length > 0)
                            ? (matchedFreq.length * 10 + matchedRare.length * 12)
                            : 0
                    };
                })
                .filter(item => item.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 3);
            }

            return {
                recentEntries,
                recorded,
                frequent,
                rareOrUnexplored,
                bridgeDishes
            };
        }

                                    <!-- Optional Notes -->
                                    <div>
                                        <label for="diaryNotes" class="block text-xs font-bold text-cocoa-900 mb-1.5">備註（選填）</label>
                                        <textarea id="diaryNotes" name="notes" rows="2" placeholder="記錄今天的口味感受、烹調心得或用餐心情..."
                                            class="w-full px-3.5 py-2 rounded-xl bg-cream-50 border border-cream-200 text-sm text-cocoa-900 focus:outline-none focus:border-sage-500">${escapeHTML(formValues.notes)}</textarea>
                                    </div>

                                    <button type="submit" class="w-full py-3 rounded-2xl bg-terracotta-500 hover:bg-terracotta-600 text-white font-bold text-sm shadow-sm transition-colors cursor-pointer">
                                        ${state.editingEntryId ? '儲存修改內容' : '儲存至我的飲食日記'}
                                    </button>
                                </form>
                            </div>

                            <!-- Right: Records for Selected Date -->
                            <div class="lg:col-span-7 space-y-5">
                                <div class="flex items-center justify-between">
                                    <h2 class="font-bold text-lg text-cocoa-900">
                                        ${state.diaryDate === getTodayStr() ? '今日餐點紀錄' : `${state.diaryDate} 餐點紀錄`}
                                        <span class="text-sm font-normal text-cocoa-700 ml-1">（共 ${selectedDateEntries.length} 筆）</span>
                                    </h2>
                                    ${state.diaryDate !== getTodayStr() ? `
                                        <button onclick="changeDiaryDate('${getTodayStr()}')" class="text-xs font-semibold text-sage-600 hover:text-sage-700 cursor-pointer">回到今天</button>
                                    ` : ''}
                                </div>

                                ${mealTypes.map(mealType => {
                                    const mealEntries = selectedDateEntries.filter(e => e.mealType === mealType);
                                    return `
                                        <div class="bg-white rounded-3xl border border-cream-200 p-5 card-shadow space-y-3">
                                            <div class="flex items-center justify-between">
                                                <span class="px-3 py-1 rounded-xl bg-sage-100 text-sage-700 text-xs font-bold">${mealType}</span>
                                                <span class="text-xs text-cocoa-700">${mealEntries.length} 筆紀錄</span>
                                            </div>

                                            ${mealEntries.length > 0 ? `
                                                <div class="space-y-3 pt-1">
                                                    ${mealEntries.map(item => `
                                                        <div class="p-4 rounded-2xl bg-cream-50 border border-cream-200 flex items-start justify-between gap-3">
                                                            <div class="space-y-2">
                                                                <h3 class="font-bold text-base text-cocoa-900">${escapeHTML(item.foodName)}</h3>
                                                                ${item.ingredients && item.ingredients.length > 0 ? `
                                                                    <div class="flex flex-wrap gap-1.5">
                                                                        ${item.ingredients.map(tag => `
                                                                            <span class="px-2.5 py-0.5 rounded-lg bg-white border border-sage-200 text-sage-700 text-xs font-medium">#${escapeHTML(tag)}</span>
                                                                        `).join('')}
                                                                    </div>
                                                                ` : ''}
                                                                ${item.notes ? `<p class="text-xs text-cocoa-700 italic">「${escapeHTML(item.notes)}」</p>` : ''}
                                                            </div>

                                                            <div class="flex items-center gap-1.5 shrink-0">
                                                                <button onclick="editDiaryEntry('${item.id}')" title="編輯紀錄" class="p-2 rounded-xl bg-white hover:bg-sage-50 text-cocoa-700 hover:text-sage-700 border border-cream-200 transition-colors cursor-pointer">
                                                                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                                                </button>
                                                                <button onclick="removeDiaryEntry('${item.id}')" title="刪除紀錄" class="p-2 rounded-xl bg-white hover:bg-red-50 text-cocoa-700 hover:text-red-600 border border-cream-200 transition-colors cursor-pointer">
                                                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                                                </button>
                                                            </div>
                                                        </div>
                                                    `).join('')}
                                                </div>
                                            ` : `
                                                <p class="text-xs text-cocoa-700/75 py-1.5">尚無${mealType}紀錄</p>
                                            `}
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    </div>

                    <!-- Section B: 7-Day Food Diary Review & Personalized Exploration (Section 3.7) -->
                    ${renderSevenDayReviewSection()}
                </div>
            `;
        }

        function renderSevenDayReviewSection() {
            const { recentEntries, recorded, frequent, rareOrUnexplored, bridgeDishes } = analyzeRecentSevenDays();
            const hasSufficientRecords = recentEntries.length >= 2 && recorded.length >= 1;

            return `
                <section id="seven-day-review-section" class="pt-10 border-t border-cream-200 space-y-6">
                    <div class="space-y-1.5">
                        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-sage-100 text-sage-700 text-xs font-bold">
                            <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                            <span>近 7 日飲食回顧與個人化探索</span>
                        </span>
                        <h2 class="text-2xl font-bold text-cocoa-900">從熟悉食材出發，發現新的飲食可能性</h2>
                        <p class="text-sm text-cocoa-700">回顧最近 7 天的餐點紀錄，觀察你最常接觸的食材，並試著搭配幾種平時較少出現在餐桌上的新食材。</p>
                    </div>

                    ${!hasSufficientRecords ? `
                        <div class="bg-white rounded-3xl border border-cream-200 p-8 sm:p-10 text-center space-y-3 card-shadow">
                            <div class="w-12 h-12 rounded-2xl bg-sage-50 text-sage-600 flex items-center justify-center mx-auto">
                                <i data-lucide="notebook-pen" class="w-6 h-6"></i>
                            </div>
                            <h3 class="text-lg font-bold text-cocoa-900">再多記錄幾餐，就能開啟你的專屬食材探索推薦！</h3>
                            <p class="text-sm text-cocoa-700 max-w-lg mx-auto leading-relaxed">
                                目前最近 7 天共有 ${recentEntries.length} 筆餐點紀錄。只要在上方飲食日記中記錄 2 筆以上的餐點並勾選食材標籤，我們就會為你整理常吃食材並推薦結合新食材的料理。
                            </p>
                        </div>
                    ` : `
                        <!-- Ingredient Frequency Comparison -->
                        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                            <!-- Frequent Ingredients -->
                            <div class="lg:col-span-6 bg-white rounded-3xl border border-cream-200 p-6 card-shadow space-y-4">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-9 h-9 rounded-xl bg-terracotta-50 text-terracotta-500 flex items-center justify-center">
                                        <i data-lucide="heart" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-base text-cocoa-900">最近經常出現的食材</h3>
                                        <p class="text-xs text-cocoa-700">近 7 天共記錄 ${recentEntries.length} 筆餐點</p>
                                    </div>
                                </div>

                                <div class="space-y-3 pt-1">
                                    ${recorded.slice(0, 5).map(item => {
                                        const maxCount = Math.max(...recorded.map(r => r.count), 1);
                                        const widthPct = Math.round((item.count / maxCount) * 100);
                                        return `
                                            <div class="space-y-1">
                                                <div class="flex justify-between text-xs font-semibold">
                                                    <span class="text-cocoa-900">${escapeHTML(item.name)}</span>
                                                    <span class="text-terracotta-600">出現 ${item.count} 次</span>
                                                </div>
                                                <div class="w-full h-2.5 rounded-full bg-cream-100 overflow-hidden">
                                                    <div class="h-full rounded-full bg-terracotta-400" style="width: ${widthPct}%"></div>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>

                            <!-- Less Frequently Recorded Ingredients -->
                            <div class="lg:col-span-6 bg-white rounded-3xl border border-cream-200 p-6 card-shadow space-y-4">
                                <div class="flex items-center gap-2.5">
                                    <div class="w-9 h-9 rounded-xl bg-sage-50 text-sage-600 flex items-center justify-center">
                                        <i data-lucide="sprout" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <h3 class="font-bold text-base text-cocoa-900">近期較少出現、值得探索的食材</h3>
                                        <p class="text-xs text-cocoa-700">點擊食材可查看風味介紹與相關食譜</p>
                                    </div>
                                </div>

                                <div class="flex flex-wrap gap-2 pt-1">
                                    ${rareOrUnexplored.slice(0, 9).map(item => `
                                        <button onclick="navigateTo('ingredients', { ingredientName: '${escapeHTML(item.name)}' })"
                                            class="px-3 py-1.5 rounded-2xl bg-sage-50 hover:bg-sage-600 text-sage-700 hover:text-white border border-sage-200 text-xs font-semibold transition-colors cursor-pointer">
                                            ${escapeHTML(item.name)}
                                            <span class="opacity-75 text-[10px] ml-0.5">(${item.count === 0 ? '近期未記錄' : '1次'})</span>
                                        </button>
                                    `).join('')}
                                </div>

                                <p class="text-xs text-cocoa-700 bg-cream-50 p-3 rounded-2xl leading-relaxed">
                                    每種食材都有獨特的風味個性，試著從你原本就喜歡的食材出發，慢慢認識新的味道組合。
                                </p>
                            </div>
                        </div>

                        <!-- Personalized Bridge Recommendations -->
                        ${bridgeDishes.length > 0 ? `
                            <div class="bg-gradient-to-br from-sage-50 via-white to-terracotta-50/50 rounded-3xl border border-sage-200 p-6 sm:p-8 card-shadow space-y-6">
                                <div>
                                    <h3 class="text-xl font-bold text-cocoa-900">為你推薦的新料理靈感</h3>
                                    <p class="text-xs sm:text-sm text-cocoa-700 mt-1">結合你最近常吃的熟悉食材與較少接觸的新食材，輕鬆跨出探索第一步：</p>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    ${bridgeDishes.map(item => {
                                        const { dish, matchedFreq, matchedRare } = item;
                                        const friendlyNote = `你最近經常吃${matchedFreq.join('與')}，這次可以試著探索${matchedRare.join('與')}料理，從熟悉的食材開始發現新的飲食可能性。`;

                                        return `
                                            <article onclick="openDishDetail('${dish.dish_id}', '${escapeHTML(friendlyNote)}')"
                                                class="cursor-pointer bg-white rounded-3xl border border-cream-200 overflow-hidden card-shadow card-hover flex flex-col justify-between">
                                                <div>
                                                    <div class="aspect-16/9 w-full overflow-hidden">
                                                        ${renderDishIllustration(dish)}
                                                    </div>
                                                    <div class="p-5 space-y-3.5">
                                                        <h4 class="text-lg font-bold text-cocoa-900">${escapeHTML(dish.dish_name)}</h4>

                                                        <p class="p-3.5 rounded-2xl bg-sage-50 border border-sage-200 text-xs text-cocoa-900 leading-relaxed">
                                                            「${escapeHTML(friendlyNote)}」
                                                        </p>

                                                        <div class="flex flex-wrap gap-1.5">
                                                            ${matchedFreq.map(f => `<span class="px-2.5 py-0.5 rounded-lg bg-terracotta-50 text-terracotta-600 text-[11px] font-semibold">熟悉食材：${escapeHTML(f)}</span>`).join('')}
                                                            ${matchedRare.map(r => `<span class="px-2.5 py-0.5 rounded-lg bg-sage-100 text-sage-700 text-[11px] font-semibold">新探索：${escapeHTML(r)}</span>`).join('')}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="px-5 pb-5">
                                                    <div class="w-full py-2.5 rounded-xl bg-cream-50 text-center text-xs font-bold text-sage-700 border border-cream-200">
                                                        查看料理詳情 →
                                                    </div>
                                                </div>
                                            </article>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}
                    `}
                </section>
            `;
        }

        function changeDiaryDate(newDate) {
            if (!newDate) return;
            state.diaryDate = newDate;
            state.editingEntryId = null;
            render();
        }

        function submitDiaryForm(event) {
            event.preventDefault();
            const form = event.target;
            const date = form.date.value;
            const mealType = form.mealType.value;
            const foodName = form.foodName.value.trim();
            const notes = form.notes.value.trim();
            const ingredients = Array.from(form.querySelectorAll('input[name="ingredients"]:checked')).map(el => el.value);

            if (!foodName) {
                showToast('請輸入食物名稱', 'error');
                return;
            }

            const entries = loadDiaryEntries();

            if (state.editingEntryId) {
                const idx = entries.findIndex(e => e.id === state.editingEntryId);
                if (idx > -1) {
                    entries[idx] = { ...entries[idx], date, mealType, foodName, ingredients, notes };
                }
                state.editingEntryId = null;
                showToast('已更新這筆飲食紀錄！', 'success');
            } else {
                entries.unshift({
                    id: 'diary_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                    date,
                    mealType,
                    foodName,
                    ingredients,
                    notes
                });
                showToast(`已將「${foodName}」加入飲食日記！`, 'success');
            }

            state.prefillDiary = null;
            state.diaryDate = date;
            saveDiaryEntries(entries);
            render();
        }

        function editDiaryEntry(entryId) {
            state.editingEntryId = entryId;
            state.prefillDiary = null;
            render();
            document.getElementById('diary-entry-form')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function cancelDiaryFormEdit() {
            state.editingEntryId = null;
            state.prefillDiary = null;
            render();
        }

        function removeDiaryEntry(entryId) {
            const updated = loadDiaryEntries().filter(e => e.id !== entryId);
            saveDiaryEntries(updated);
            if (state.editingEntryId === entryId) state.editingEntryId = null;
            showToast('已刪除該筆飲食紀錄', 'success');
            render();
        }

        // =========================================================================
        // 8. MASTER RENDER & EVENT LISTENERS
        // =========================================================================
        function render() {
            updateActiveNav();
            const container = document.getElementById('app-content');

            switch (state.currentRoute) {
                case 'home':
                    container.innerHTML = renderHomeView();
                    break;
                case 'explore':
                    container.innerHTML = renderExploreView();
                    break;
                case 'ingredients':
                    container.innerHTML = renderIngredientsView();
                    break;
                case 'diary':
                    container.innerHTML = renderDiaryView();
                    break;
                default:
                    container.innerHTML = renderHomeView();
            }

            lucide.createIcons();
        }

        document.getElementById('dish-modal').addEventListener('click', function(e) {
            if (e.target === this) closeDishDetail();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeDishDetail();
        });

        window.addEventListener('DOMContentLoaded', () => {
            render();
        });
    </script>
</body>
</html>
